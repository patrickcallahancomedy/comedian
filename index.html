            <div>
              <div class="person-name">Troy</div>

            </div>
          </div>

          <div class="reaction">
            Troy closes the door.<br><br>
            “We talked about your numbers. It’s not getting better.”
            <br><br>
            “Clock out. Today’s your last day.”
          </div>

          <div class="knowledge" style="margin-top:10px">
            You no longer work here.
          </div>
        </div>

        <button class="action" id="performanceFiredLeave">GET YOUR STUFF</button>
      </div>
    </div>`;

  document.getElementById('performanceFiredLeave').onclick=renderFiredAftermath;
}

function promotionChance(){
  if(state.promotionOffered || state.promoted)return 0;
  if(state.day<3 || state.workWarnings>0)return 0;

  // Declining means "not right now." Troy can circle back after a week.
  if(state.promotionDeclinedDay!==null &&
     state.day-state.promotionDeclinedDay<7)return 0;

  const troy=state.people.find(p=>p.name==="Troy" && p.personality==="boss");
  if(!troy || troy.relationship<58)return 0;

  const trouble=SOCIAL_ENGINE.workTrouble();
  if(trouble>.10)return 0;

  // Rare alternate-life branch. Once Troy genuinely likes Darren and
  // Darren is performing very well, there is still only a small chance
  // the timing lines up for a promotion offer.
  const relationshipBonus=Math.min(.10,Math.max(0,(troy.relationship-58)*.015));
  return .35 + relationshipBonus;
}

function maybeOfferPromotion(){
  const chance=promotionChance();
  return chance>0 && Math.random()<chance;
}

function renderPromotionOffer(){
  state.phase='promotion_offer';
  state.promotionOffered=true;
  saveGame();

  const troy=state.people.find(p=>p.name==="Troy") || {relationship:0};

  game.innerHTML=topbar()+`

      <div class="card">
        <div class="eyebrow">5:03 PM • SHIPPING OFFICE</div>

            </div>

          </div>

          <div class="reaction">
            “You’ve been solid lately. I want to move you up to shift lead.”
          </div>

          <div class="knowledge" style="margin-top:10px">
            + $1.50 / hour<br>
            More responsibility
          </div>
        </div>

        <div class="end-note">
          You’d help keep the line moving, cover problems when Troy is busy,
          and be the person people come find when something goes wrong.
        </div>

        <button class="action" id="takePromotion">TAKE THE PROMOTION</button>
        <button class="boot-btn" id="declinePromotion">I'M GOOD WHERE I'M AT</button>
      </div>
    </div>`;

  document.getElementById('takePromotion').onclick=()=>{
    state.promoted=true;
    state.promotionDeclined=false;
    state.promotionDeclinedDay=null;
    state.jobTitle="Shift Lead";
    state.workResponsibility=1;
    state.hourlyPayBonus=1.50;
    troy.relationship=Math.min(100,troy.relationship+3);
    state.phase='promotion_result';
    saveGame();
    renderPromotionResult(true);
  };

  document.getElementById('declinePromotion').onclick=()=>{
    state.promotionDeclined=true;
    state.promotionDeclinedDay=state.day;
    state.promotionOffered=false;
    state.phase='promotion_result';
    saveGame();
    renderPromotionResult(false);
  };
}

function renderPromotionResult(accepted){
  game.innerHTML=topbar()+`
    <div class="screen">
      <div class="card">
        <div class="eyebrow">5:08 PM</div>
        <h1>${accepted ? `You’re a shift lead now.` : `You stay where you are.`}</h1>
        <div class="copy">
          ${accepted
            ? `More money. More people asking where you are.`
            : `Troy nods. “Alright. Offer stands if things change.”`}
        </div>

        ${accepted
          ? `<div class="end-note">
               This job will ask more of your time later.
             </div>`
          : ''}

        <button class="action" id="promotionContinue">CLOCK OUT</button>
      </div>
    </div>`;

  document.getElementById('promotionContinue').onclick=()=>endShift(true,true);
}

function endShift(skipPromotionCheck=false,skipWorkConsequence=false){
  state.phase='end';
  clearInterval(tickTimer);
  clearTimeout(boxTimer);
  clearTimeout(thoughtTimer);
  clearTimeout(thoughtHideTimer);
  thoughtActive=false;
  state.writingThought=false;
  currentThought='';

  // Work performance matters even if Darren never tells Troy a joke.
  if(!skipWorkConsequence && maybeHandleBadWorkAtClockout()){
    return;
  }

  if(!skipPromotionCheck && maybeOfferPromotion()){
    renderPromotionOffer();
    return;
  }

  let note='';
  if(state.savedThoughts.length){
    const t=state.savedThoughts[0];
    note=`On the drive home, one thought comes back:<br><br><em>“${escapeHtml(t)}”</em>`;
  }else{
    note=`On the drive home, your brain is completely empty. You mostly think about food.`;
  }

  game.innerHTML=topbar()+`
    <div class="screen">
      <div class="card">
        <div class="eyebrow">5:26 PM</div>
        <h1>Clock out.</h1>
        <div class="copy">You made it through another shift.</div>
        ${SOCIAL_ENGINE.learnedToday("back_room_open_mic")
          ? `<div class="end-note">
               Somewhere across town, people are getting on stage for free on Tuesday nights.
             </div>`
          : ''}
        <div class="end-note">${note}</div>
        <div class="statsline">
          <div class="pill">${state.processed} boxes scanned</div>
          <div class="pill">${state.savedThoughts.length} thought${state.savedThoughts.length===1?'':'s'} kept</div>
        </div>
        ${SOCIAL_ENGINE.knows("back_room_open_mic") && isTuesday()
          ? `<button class="action" id="micTonight">GO HOME</button>`
          : `<button class="action" id="again">NEXT DAY</button>`}
      </div>
    </div>`;

  const micTonight=document.getElementById('micTonight');
  if(micTonight){
    micTonight.onclick=renderMicDecision;
  }else{
    document.getElementById('again').onclick=advanceOneDay;
  }
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
