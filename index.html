<!doctype html>
<!-- COMEDIAN BUILD: Lab 35 -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>COMEDIAN — Beginning Lab 35</title>
<meta name="comedian-build" content="Lab 35">
<style>
:root{
  --bg:#050505;
  --panel:#0b0b0b;
  --line:#292929;
  --text:#f4f1ec;
  --mut:#9d9994;
  --red:#a9152c;
  --red2:#d02442;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;min-height:100%}
body{min-height:100vh;overflow-x:hidden;overflow-y:auto}
button{font:inherit}
#game{min-height:100vh;display:flex;flex-direction:column}
.topbar{
  height:52px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  border-bottom:1px solid var(--line);
  background:#070707;
}
.logo{font-weight:900;letter-spacing:1.5px}
.lab{font-size:11px;color:var(--mut);letter-spacing:1.5px;text-transform:uppercase}
.screen{flex:1;display:flex;align-items:center;justify-content:center;padding:22px 22px calc(110px + env(safe-area-inset-bottom))}
.card{width:min(720px,100%);margin:auto}
.eyebrow{font-size:11px;color:var(--red2);letter-spacing:2px;text-transform:uppercase;font-weight:800;margin-bottom:10px}
h1{font-size:clamp(38px,10vw,64px);line-height:.95;margin:0 0 18px;letter-spacing:-1.5px}
.copy{font-size:18px;line-height:1.55;max-width:610px;color:#e5e1dc}
.mut{color:var(--mut);line-height:1.5}
.action{
  width:100%;
  margin-top:26px;
  padding:16px;
  border:1px solid #5a1824;
  border-left:4px solid var(--red);
  background:#0b0708;
  color:white;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.6px;
}
.action:active{background:#19090d}
.work-wrap{width:min(780px,100%);margin:auto}
.work-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-end;margin-bottom:14px}
.shift-title{font-size:28px;font-weight:900}
.small{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:1.2px}
.meter{
  height:7px;background:#171717;border:1px solid #252525;overflow:hidden;margin:8px 0 16px
}
.meter > div{height:100%;width:100%;background:#b9b9b9;transition:width .18s linear}
.station{
  border:1px solid var(--line);
  background:var(--panel);
  min-height:320px;
  position:relative;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}
.conveyor{
  flex:1;
  min-height:215px;
  position:relative;
  overflow:hidden;
  padding:28px 20px 38px;
}
.conveyor::after{
  content:"";
  position:absolute;
  left:0;right:0;bottom:18px;
  height:18px;
  border-top:1px solid #2d2d2d;
  border-bottom:1px solid #242424;
  background:
    repeating-linear-gradient(
      90deg,
      #111 0 26px,
      #1b1b1b 26px 31px
    );
  background-size:62px 100%;
  animation:beltMove 1.2s linear infinite;
}
@keyframes beltMove{
  from{background-position:0 0}
  to{background-position:-62px 0}
}
.box{
  width:190px;height:124px;
  background:#171717;
  border:1px solid #3a3a3a;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  box-shadow:0 12px 30px rgba(0,0,0,.35);
  position:absolute;
  top:52%;
  left:50%;
  z-index:2;
  transform:translate(160%,-50%);
}
.box.travel{
  animation:boxPass 2.4s linear forwards;
}
.box.scanned{
  animation:none;
  transform:translate(-50%,-50%);
  transition:transform .20s ease-in,opacity .20s ease-in;
  opacity:.35;
}
.box.scanned.go{
  transform:translate(-180%,-50%) rotate(-2deg);
  opacity:0;
}
@keyframes boxPass{
  0%{transform:translate(170%,-50%)}
  34%{transform:translate(-50%,-50%)}
  66%{transform:translate(-50%,-50%)}
  100%{transform:translate(-260%,-50%)}
}
.barcode{font-family:monospace;letter-spacing:3px;font-size:20px;margin-top:10px;color:#aaa}
.boxlabel{font-size:11px;color:#777;letter-spacing:1.2px}
.thought{
  position:absolute;
  left:50%;
  top:16px;
  transform:translate(-50%,-6px);
  width:min(90%,520px);
  border:1px solid #4a363a;
  border-left:4px solid var(--red);
  background:#090909;
  padding:13px 15px;
  color:#d8d2cc;
  font-style:italic;
  opacity:0;
  pointer-events:none;
  transition:opacity .15s ease,transform .15s ease;
}
.thought.show{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
.thought small{display:block;font-style:normal;color:var(--red2);font-size:9px;letter-spacing:1.5px;margin-bottom:6px;text-transform:uppercase}
.controls{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  padding:12px;
  border-top:1px solid var(--line);
  background:#080808;
}
.ctrl{
  min-height:58px;
  border:1px solid #333;
  background:#101010;
  color:white;
  font-weight:850;
}
.ctrl:active{background:#1a1a1a}
.ctrl.red{border-color:#5a1824;color:#fff}
.ctrl:disabled{opacity:.35}
.feedback{
  min-height:24px;
  margin-top:10px;
  color:#b5b0aa;
  font-size:13px;
}
.statsline{
  display:flex;
  gap:14px;
  flex-wrap:wrap;
  margin-top:14px;
  color:#8d8984;
  font-size:12px;
}
.pill{
  border:1px solid #262626;
  padding:7px 9px;
  background:#090909;
}
.end-note{
  border:1px solid #3c3032;
  border-left:4px solid var(--red);
  padding:14px 15px;
  background:#090909;
  margin-top:18px;
  color:#ddd6cf;
}
@media(max-width:560px){
  .screen{padding:16px}
  .station{min-height:350px}
  .conveyor{min-height:245px}
  .box{width:165px;height:112px}
}

.ctrl.writing{
  position:relative;
  overflow:hidden;
  color:#fff;
}
.ctrl.writing::after{
  content:"";
  position:absolute;
  left:0;bottom:0;
  height:3px;
  width:0;
  background:var(--red2);
  animation:writeProgress 1.35s linear forwards;
}
@keyframes writeProgress{
  from{width:0}
  to{width:100%}
}
.station.writing .box{
  filter:brightness(.82);
}


.social-card{
  border:1px solid #302a29;
  background:#090909;
  padding:16px;
  margin-top:18px;
}
.person-head{
  display:flex;
  justify-content:space-between;
  gap:14px;
  align-items:flex-start;
}
.person-name{
  font-size:22px;
  font-weight:900;
}
.person-role{
  color:#8f8984;
  font-size:11px;
  letter-spacing:1.2px;
  text-transform:uppercase;
  margin-top:4px;
}
.person-vibe{
  color:#b6afa8;
  font-size:13px;
  margin-top:10px;
  line-height:1.45;
}
.social-actions{
  display:grid;
  gap:9px;
  margin-top:14px;
}
.social-btn{
  width:100%;
  text-align:left;
  padding:13px 14px;
  border:1px solid #34302d;
  border-left:3px solid #8f1427;
  background:#0c0c0c;
  color:#f4f1ec;
  font-weight:800;
}
.social-btn:active{background:#171011}
.social-btn:disabled{opacity:.38}
.reaction{
  margin-top:14px;
  padding:13px 14px;
  border:1px solid #292524;
  background:#070707;
  color:#d4cec7;
  line-height:1.5;
}
.knowledge{
  margin-top:10px;
  border-left:3px solid var(--red);
  padding:9px 11px;
  background:#0b0708;
  color:#e5ddd6;
}
.people-strip{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:15px;
}
.person-pill{
  border:1px solid #292929;
  padding:7px 9px;
  font-size:12px;
  color:#aaa49e;
  background:#080808;
}


/* Lab 10: hidden-title first boot + unlock reveal */
.boot{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:#050505;
}
.boot-card{width:min(520px,100%)}
.boot-kicker{
  color:#777;
  font-size:11px;
  letter-spacing:2px;
  text-transform:uppercase;
  margin-bottom:18px;
}
.boot-btn{
  width:100%;
  padding:16px;
  margin:8px 0;
  border:1px solid #343434;
  border-left:4px solid var(--red);
  background:#0b0b0b;
  color:#f4f1ec;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.8px;
}
.boot-btn:disabled{opacity:.32}
.precomic-bar{
  height:44px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  border-bottom:1px solid var(--line);
  background:#070707;
  color:#87827d;
  font-size:11px;
  letter-spacing:1.4px;
  text-transform:uppercase;
}
.reveal{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:#030303;
  text-align:center;
}
.reveal-logo{
  font-size:clamp(56px,16vw,112px);
  line-height:.88;
  font-weight:1000;
  letter-spacing:-4px;
  margin:0;
}
.reveal-tag{
  margin-top:20px;
  color:#b8b1aa;
  font-size:12px;
  letter-spacing:2.2px;
  text-transform:uppercase;
}
.reveal-copy{
  max-width:520px;
  margin:28px auto 0;
  color:#8e8882;
  line-height:1.55;
}
.reveal-actions{
  width:min(480px,100%);
  margin:30px auto 0;
  display:grid;
  gap:10px;
}
.life-grid{
  display:grid;
  gap:10px;
  margin-top:18px;
}
.life-card{
  border:1px solid #302d2a;
  border-left:3px solid #8f1427;
  padding:14px;
  background:#090909;
  text-align:left;
}
.life-card strong{font-size:20px}
.life-card span{
  display:block;
  margin-top:4px;
  color:#8d8782;
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:1px;
}


.life-selectable{
  width:100%;
  color:#f4f1ec;
  font:inherit;
  cursor:pointer;
  appearance:none;
  -webkit-appearance:none;
}
.life-selectable:active{transform:translateY(1px);border-color:#8f1427}

.scan-zone{
  position:absolute;
  left:50%;
  top:52%;
  transform:translate(-50%,-50%);
  width:215px;
  height:145px;
  border-left:2px solid #3d3d3d;
  border-right:2px solid #3d3d3d;
  z-index:1;
  pointer-events:none;
}
.scan-zone::before{
  content:"SCAN";
  position:absolute;
  top:-18px;
  left:50%;
  transform:translateX(-50%);
  font-size:9px;
  letter-spacing:1.5px;
  color:#626262;
}
.station.scan-ready .scan-zone{
  border-color:#9d1830;
}
.station.scan-ready .scan-zone::before{
  color:#c3223c;
}


.social-actions.locked{
  pointer-events:none;
  opacity:.45;
}
.social-actions.locked::before{
  content:"LUNCH BREAK";
  display:block;
  color:#777;
  font-size:10px;
  letter-spacing:1.4px;
  margin-bottom:6px;
}


.premise-option .choice-effect{
  display:block;
  margin-top:6px;
  color:#aaa39c;
  font-size:12px;
  font-weight:500;
  line-height:1.4;
  text-transform:none;
  letter-spacing:0;
}


.mic-prep{
  display:grid;
  gap:10px;
  margin-top:22px;
}
.prep-step{
  border:1px solid #34302d;
  border-left:3px solid #8f1427;
  background:#090909;
  padding:14px 15px;
  color:#f4f1ec;
  text-align:left;
  font-weight:850;
}
.prep-step.done{
  border-left-color:#777;
  color:#8f8984;
}
.prep-step.done::after{
  content:" ✓";
  color:#b8b1aa;
}
.prep-step:disabled{opacity:.45}
.notes-list{
  display:grid;
  gap:8px;
  margin-top:10px;
}
.note-choice{
  width:100%;
  text-align:left;
  border:1px solid #302c2a;
  background:#080808;
  color:#ddd7d0;
  padding:12px 13px;
  line-height:1.4;
}
.note-choice.selected{
  border-color:#8f1427;
  border-left:4px solid var(--red);
  background:#0d0708;
}
.prep-status{
  margin-top:16px;
  font-size:12px;
  color:#8f8984;
  line-height:1.5;
}
.stage-wrap{
  width:min(760px,100%);
  margin:auto;
}
.stage-room{
  border:1px solid #2f2b29;
  background:#070707;
  padding:18px;
  min-height:360px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}
.stage-cue{
  color:#d5cec7;
  font-size:15px;
  line-height:1.5;
  min-height:50px;
}
.stage-premise{
  margin:14px 0 22px;
  padding:13px 14px;
  border-left:3px solid var(--red);
  background:#0b0708;
  color:#cfc8c1;
  font-style:italic;
  line-height:1.45;
}
.timing-label{
  font-size:10px;
  letter-spacing:1.4px;
  color:#777;
  text-transform:uppercase;
  margin-bottom:7px;
}
.timing-lane{
  position:relative;
  height:44px;
  border:1px solid #35312f;
  background:#0d0d0d;
  overflow:hidden;
}
.timing-target{
  position:absolute;
  top:0;
  bottom:0;
  background:#2a080e;
  border-left:1px solid #9b1530;
  border-right:1px solid #9b1530;
}
.timing-perfect{
  position:absolute;
  top:0;
  bottom:0;
  background:#50101b;
  opacity:.62;
}
.timing-marker{
  position:absolute;
  top:5px;
  bottom:5px;
  width:4px;
  background:#f5f1ec;
  box-shadow:0 0 10px rgba(255,255,255,.25);
  transform:translateX(-2px);
}
.stage-reaction{
  min-height:48px;
  margin-top:14px;
  color:#aaa39c;
  line-height:1.45;
}
.stage-progress{
  display:flex;
  gap:6px;
  margin-top:14px;
}
.stage-dot{
  flex:1;
  height:3px;
  background:#282828;
}
.stage-dot.done{background:#8f1427}
.result-grade{
  display:inline-block;
  color:#d42944;
  font-size:11px;
  font-weight:900;
  letter-spacing:1.6px;
  text-transform:uppercase;
  margin-bottom:10px;
}
.quit-note{
  margin-top:14px;
  color:#8e8882;
  font-size:13px;
  line-height:1.5;
}


/* LAB 21 — warehouse HUD refresh */
.work-wrap{width:min(820px,100%);margin:auto}
.work-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:16px;
  margin-bottom:10px;
}
.shift-clock{
  min-width:74px;
  text-align:right;
  font-size:34px;
  font-weight:950;
  line-height:.9;
  font-variant-numeric:tabular-nums;
}
.shift-clock small{
  display:block;
  margin-top:7px;
  color:#79746f;
  font-size:9px;
  letter-spacing:1.6px;
}
.shift-progress{
  height:3px;
  background:#171717;
  overflow:hidden;
  margin-bottom:12px;
}
.shift-progress > div{
  height:100%;
  width:0;
  background:#8e1629;
  transition:width .25s linear;
}
.work-dashboard{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  border:1px solid #292929;
  background:#080808;
  margin-bottom:10px;
}
.hud-stat{
  min-height:58px;
  padding:10px 12px;
  border-right:1px solid #242424;
}
.hud-stat:last-child{border-right:0}
.hud-label{
  color:#77716d;
  font-size:8px;
  font-weight:850;
  letter-spacing:1.4px;
  text-transform:uppercase;
}
.hud-value{
  margin-top:5px;
  font-size:22px;
  font-weight:950;
  font-variant-numeric:tabular-nums;
}
.hud-value span.unit{
  color:#77716d;
  font-size:10px;
  margin-left:2px;
}
.station{
  min-height:360px;
  border:1px solid #302d2b;
  background:#080808;
  box-shadow:inset 0 0 0 1px #0d0d0d;
}
.conveyor{
  min-height:245px;
  padding-top:32px;
  background:
    linear-gradient(180deg,#090909 0%,#080808 65%,#0b0b0b 100%);
}
.belt-direction{
  position:absolute;
  left:14px;
  bottom:42px;
  z-index:1;
  color:#55514d;
  font-size:8px;
  font-weight:850;
  letter-spacing:1.6px;
}
.scan-zone{
  width:222px;
  height:150px;
  border:1px dashed #393532;
  border-left:2px solid #514b47;
  border-right:2px solid #514b47;
  background:rgba(255,255,255,.012);
}
.scan-zone::before{
  content:"SCAN WINDOW";
  top:-21px;
  color:#6d6762;
  font-weight:850;
}
.scan-zone::after{
  content:"";
  position:absolute;
  left:8px;right:8px;

  height:1px;

}
.station.scan-ready .scan-zone{
  border-style:solid;

}

.box{
  border:1px solid #46413e;

}
.boxlabel{

  border:1px solid #302d2b;

}
.controls{
  grid-template-columns:1.45fr .85fr;

}

}

}
.station-feedback{

}
.thought{

  width:min(92%,540px);
  box-shadow:0 9px 28px rgba(0,0,0,.42);
}

  .work-dashboard{grid-template-columns:1fr 1fr}
  .hud-stat{border-bottom:1px solid #242424}
  .hud-stat:nth-child(2){border-right:0}
  .hud-stat:nth-child(3),.hud-stat:nth-child(4){border-bottom:0}
  .controls{grid-template-columns:1.35fr .9fr}
  .station{min-height:385px}
}


/* LAB 22 — simple colorful arcade pass */
.work-wrap{
  width:min(740px,100%);
  margin:auto;
}
.work-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:14px;
  margin-bottom:10px;
}
.shift-title{
  font-size:22px;
  font-weight:950;
}
.shift-clock{
  min-width:72px;
  text-align:center;
  padding:9px 10px;
  border:1px solid #303030;
  border-radius:14px;
  background:#0d0d0d;
  font-size:30px;
  font-weight:950;
  line-height:1;
  font-variant-numeric:tabular-nums;
}
.shift-clock small{
  display:block;
  margin-top:5px;
  color:#777;
  font-size:8px;
  letter-spacing:1.4px;
}
.line-meter{
  height:13px;
  margin:0 0 12px;
  border:1px solid #2d2d2d;
  border-radius:999px;
  background:#111;
  overflow:hidden;
}
.line-fill{
  width:100%;
  height:100%;
  border-radius:999px;
  background:linear-gradient(90deg,#ff4d6d,#ffd166 48%,#06d6a0);
  transition:width .18s linear;
}
.line-meter.danger .line-fill{
  box-shadow:0 0 14px rgba(255,77,109,.35);
}
.station{
  position:relative;
  min-height:385px;
  overflow:hidden;
  border:1px solid #292929;
  border-radius:19px;
  background:
    radial-gradient(circle at 50% 5%,rgba(76,111,255,.10),transparent 40%),
    #080808;
}
.conveyor{
  min-height:275px;
  padding-top:44px;
}
.scan-zone{
  width:215px;
  height:155px;
  border:3px solid #323b76;
  border-radius:18px;
  background:rgba(76,111,255,.04);
  box-shadow:inset 0 0 28px rgba(76,111,255,.05);
  transition:.14s ease;
}
.scan-zone::before{
  content:"SCAN";
  top:-27px;
  color:#7180df;
  font-size:10px;
  font-weight:950;
  letter-spacing:2px;
}
.scan-zone::after{
  content:"";
  position:absolute;
  left:12px;
  right:12px;
  top:50%;
  height:3px;
  border-radius:999px;
  background:#4c6fff;
  opacity:.28;
  box-shadow:0 0 12px #4c6fff;
}
.station.scan-ready .scan-zone{
  border-color:#06d6a0;
  background:rgba(6,214,160,.10);
  box-shadow:0 0 25px rgba(6,214,160,.20),inset 0 0 28px rgba(6,214,160,.08);
}
.station.scan-ready .scan-zone::before{color:#06d6a0}
.station.scan-ready .scan-zone::after{
  background:#06d6a0;
  opacity:1;
  box-shadow:0 0 18px #06d6a0;
}
.box{
  width:126px;
  height:96px;
  border:0;
  border-radius:12px;
  background:#4c6fff;
  box-shadow:
    inset -13px -13px 0 rgba(0,0,0,.12),
    0 12px 28px rgba(0,0,0,.38);
}

.box.box-orange{background:#ff9f43}
.box.box-purple{background:#a55eea}
.box.box-green{background:#20bf6b}

  color:#252525;
  background:rgba(255,255,255,.84);

  font-weight:950;
}

  font-size:16px;
  margin-top:9px;
}
.thought{

  border-left:0;
  border-radius:4px;
  background:#ffd166;
  color:#211f1a;

}

}
.thought span{

.station-feedback{

}

}
.station-feedback.bad{

}
.controls{

}

}
#scan{

}

}

}
.ctrl:disabled{opacity:.30}

  100%{box-shadow:none}

<body>
<div id="game"></div>
<button class="build-badge" id="buildBadge" type="button" aria-expanded="false" aria-controls="devPanel">LAB 35</button>
<aside class="dev-panel" id="devPanel" hidden>
  <div class="dev-title">Developer Tools · Lab 35</div>
  <pre class="dev-readout" id="devReadout"></pre>
  <div class="dev-actions">
    <button class="dev-action" id="devRefresh" type="button">REFRESH</button>
    <button class="dev-action" id="devCopy" type="button">COPY DEBUG</button>
  </div>
  <div class="dev-status" id="devStatus"></div>
</aside>
<script>
const game=document.getElementById('game');


function defaultPreShowState(){
  return {
    nervesDelta:0,
    confidenceDelta:0,
    stagePresenceDelta:0,
    timeSenseDelta:0,
    riffingDelta:0,
    crowdForgivenessDelta:0,
    crowdReadBonus:0,
    focusDelta:0,
    energyDelta:0,
    intoxication:0,
    sourceChoices:[]
  };
}
function freshComedyState(randomizeTrait=true){
  return {
    totalSets:0,
    skills:{stagePresence:0,timeSense:0,riffing:0},
    traits:{phenom:randomizeTrait ? Math.random()<.035 : false},
    unlocks:{killing:false,crushing:false},
    crowds:{
      back_room_tuesday:{
        id:"back_room_tuesday",
        forgiveness:.64,
        returningRate:.72,
        repeatTolerance:.45,
        memory:{}
      }
    },
    preShow:defaultPreShowState(),
    pendingNotebookIdeas:[]
  };
}

const state={
  phase:'boot',
  firstMicDone:false,
  comedianUnlocked:false,
  firstMicPremiseId:null,
  firstMicPremiseIds:[],
  storySeen:false,
  micPrep:{changed:false,changeItems:[],showerProgress:0,showered:false,outfit:null,outfitRoast:null,setLocked:false,keysFound:false,keySpot:null,keyAttempts:[],keySearchActive:false},
  firstSetScores:[],
  firstSetResult:null,
  comedy:freshComedyState(false),
  employed:true,
  firedDay:null,
  workWarnings:0,
  bossFavorite:false,
  promotionOffered:false,
  promoted:false,
  promotionDeclined:false,
  promotionDeclinedDay:null,
  jobTitle:"Warehouse Worker",
  workResponsibility:0,
  hourlyPayBonus:0,
  day:1,
  timeLeft:30,
  quota:100,
  processed:0,
  misses:0,
  savedThoughts:[],
  premises:[],
  thoughtsShown:0,
  writingThought:false,
  people:[],
  knownInfo:[],
  opportunities:[],
  materialFeedback:[],
  currentCoworker:null,
  lastCoworkerId:null,
  lunchDay:null,
  thoughtTriggers:[],
  nextThoughtTrigger:0,
  hidden:{
    observation:1,
    confidence:.26,
    nerves:.72,
    writing:1,
    stageSkill:0
  }
};

const thoughts=[
  "Why do boxes always say FRAGILE like the box knows what’s in it?",
  "Everybody here walks like they’re late to something that doesn’t matter.",
  "The scanner only works after you threaten it.",
  "I’ve been wearing a name tag for six hours and nobody has learned my name.",
  "Every workplace has one chair that belongs to nobody but somehow has an owner.",
  "The break room microwave has seen things no appliance should see.",
  "Nobody walks faster than a person pretending they weren’t just in the bathroom.",
  "Every manager says 'real quick' before something that is not real quick.",
  "The safety poster looks way more dangerous than the warehouse.",
  "We scan the box three times so the computer can believe it exists.",
  "The guy who says he hates drama always has the most updates.",
  "A clipboard turns any idiot into an authority figure.",
  "Every break room has one fork that has survived multiple companies.",
  "The warehouse radio only plays songs you know the chorus to and nothing else.",
  "People say 'living the dream' exclusively when they are not.",
  "The pallet jack becomes a race car the second the boss leaves.",
  "Nobody reads the employee handbook until they are already in trouble.",
  "A five-minute break has never lasted five minutes emotionally.",
  "The vending machine charges airport prices for food from a gas station.",
  "The person closest to the thermostat becomes the building's government.",
  "Every job has a guy who knows exactly how much everybody else makes.",
  "You can tell how long somebody has worked here by how little urgency they have.",
  "Calling something a team-building exercise is a threat.",
  "The phrase 'we're like a family here' has never been followed by good news.",
  "A mandatory meeting is just work making you watch work happen.",
  "The cleanest safety vest belongs to the person doing the least dangerous job.",
  "Everyone has a fake work voice they don't use anywhere else.",
  "The clock moves slower when you look directly at it.",
  "The best employee is usually just the person who knows where everything is.",
  "Somebody has been reheating the same fish in every office since 1997."
];

const weekendThoughts=[
  "Grocery stores make everybody look like they are preparing for a very specific emergency.",
  "Saturday errands are just work you don't get paid for.",
  "Nobody has ever folded a fitted sheet without getting angry.",
  "You clean one room and somehow make two other rooms worse.",
  "The self-checkout asking for a tip would honestly not surprise me anymore.",
  "Laundry is a subscription service where you provide the labor.",
  "The older you get, the more exciting cancelling plans becomes.",
  "A frozen pizza has instructions like there is more than one possible outcome."
];

const WEEKDAYS=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];

function weekdayName(day=state.day){
  return WEEKDAYS[(Math.max(1,day)-1)%7];
}
function isTuesday(day=state.day){
  return weekdayName(day)==="Tuesday";
}
function topbar(){
  return `<div class="precomic-bar"><div>DARREN</div><div>${weekdayName().toUpperCase()} · DAY ${state.day}</div></div>`;
}


const BUILD_VERSION="Lab 35";
const SAVE_KEY="comedian_lab32_save";

function developerSnapshot(){
  return {
    build:BUILD_VERSION,
    phase:state.phase,
    day:state.day,
    weekday:weekdayName(),
    timeLeft:state.timeLeft,
    work:`${state.processed}/${state.quota}`,
    misses:state.misses,
    savedThoughts:state.savedThoughts.length,
    premises:state.premises.length,
    employed:state.employed,
    firstMicDone:state.firstMicDone,
    comedianUnlocked:state.comedianUnlocked
  };
}
function refreshDeveloperPanel(){
  const readout=document.getElementById('devReadout');
  if(readout)readout.textContent=JSON.stringify(developerSnapshot(),null,2);
}
function setupDeveloperTools(){
  const badge=document.getElementById('buildBadge');
  const panel=document.getElementById('devPanel');
  const status=document.getElementById('devStatus');
  badge.onclick=()=>{
    panel.hidden=!panel.hidden;
    badge.setAttribute('aria-expanded',String(!panel.hidden));
    if(!panel.hidden)refreshDeveloperPanel();
  };
  document.getElementById('devRefresh').onclick=refreshDeveloperPanel;
  document.getElementById('devCopy').onclick=async()=>{
    const debugText=JSON.stringify(developerSnapshot(),null,2);
    try{
      await navigator.clipboard.writeText(debugText);
      status.textContent='Debug info copied.';
    }catch(e){
      status.textContent='Copy blocked by browser. Select the text above.';
    }
  };
}

function ensureCoreSchema(){
  if(typeof state.storySeen!=="boolean")state.storySeen=true;
  if(!Array.isArray(state.firstMicPremiseIds)){
    state.firstMicPremiseIds=state.firstMicPremiseId?[state.firstMicPremiseId]:[];
  }
  const oldPrep=(state.micPrep&&typeof state.micPrep==="object")?state.micPrep:{};
  state.micPrep={
    changed:!!(oldPrep.changed||oldPrep.dressed),
    changeItems:Array.isArray(oldPrep.changeItems)?oldPrep.changeItems:[],
    showerProgress:Number.isFinite(oldPrep.showerProgress)?oldPrep.showerProgress:0,
    showered:!!oldPrep.showered,
    outfit:oldPrep.outfit||null,
    outfitRoast:oldPrep.outfitRoast||null,
    setLocked:!!(oldPrep.setLocked||oldPrep.notesOpened),
    keysFound:!!(oldPrep.keysFound||oldPrep.keys),
    keySpot:Number.isFinite(oldPrep.keySpot)?oldPrep.keySpot:null,
    keyAttempts:Array.isArray(oldPrep.keyAttempts)?oldPrep.keyAttempts:[],
    keySearchActive:!!oldPrep.keySearchActive
  };
  if(!state.hidden)state.hidden={};
  if(!Number.isFinite(state.hidden.confidence))state.hidden.confidence=.26;
  if(!Number.isFinite(state.hidden.nerves))state.hidden.nerves=.72;

  if(!state.comedy || typeof state.comedy!=="object"){
    state.comedy=freshComedyState(false);
  }
  if(!Number.isFinite(state.comedy.totalSets))state.comedy.totalSets=state.firstMicDone?1:0;

  state.comedy.skills=state.comedy.skills||{};
  if(!Number.isFinite(state.comedy.skills.stagePresence)){
    state.comedy.skills.stagePresence=Number.isFinite(state.hidden.stageSkill)?state.hidden.stageSkill:0;
  }
  if(!Number.isFinite(state.comedy.skills.timeSense))state.comedy.skills.timeSense=0;
  if(!Number.isFinite(state.comedy.skills.riffing))state.comedy.skills.riffing=0;

  state.comedy.traits=state.comedy.traits||{};
  if(typeof state.comedy.traits.phenom!=="boolean")state.comedy.traits.phenom=false;

  state.comedy.unlocks=state.comedy.unlocks||{};
  if(typeof state.comedy.unlocks.killing!=="boolean")state.comedy.unlocks.killing=false;
  if(typeof state.comedy.unlocks.crushing!=="boolean")state.comedy.unlocks.crushing=false;

  state.comedy.crowds=state.comedy.crowds||{};
  if(!state.comedy.crowds.back_room_tuesday){
    state.comedy.crowds.back_room_tuesday=freshComedyState(false).crowds.back_room_tuesday;
  }
  const crowd=state.comedy.crowds.back_room_tuesday;
  if(!Number.isFinite(crowd.forgiveness))crowd.forgiveness=.64;
  if(!Number.isFinite(crowd.returningRate))crowd.returningRate=.72;
  if(!Number.isFinite(crowd.repeatTolerance))crowd.repeatTolerance=.45;
  crowd.memory=crowd.memory||{};

  state.comedy.preShow={...defaultPreShowState(),...(state.comedy.preShow||{})};
  state.comedy.pendingNotebookIdeas=state.comedy.pendingNotebookIdeas||[];
}



function saveGame(){
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(state));}catch(e){}
}
function hasSave(){
  try{return !!localStorage.getItem(SAVE_KEY);}catch(e){return false;}
}
function loadSavedState(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(!raw)return false;
    Object.assign(state,JSON.parse(raw));
    ensureCoreSchema();
    return true;
  }catch(e){return false;}
}
function clearTimers(){
  clearInterval(tickTimer);
  clearTimeout(boxTimer);
  clearTimeout(thoughtTimer);
  clearTimeout(thoughtHideTimer);
  clearTimeout(scanOpenTimer);
  clearTimeout(scanCloseTimer);
  stopDriveGame();
  stopSignupGame();
  stopStageCore();
}
function newGame(){
  clearTimers();
  state.phase='intro';
  state.firstMicDone=false;
  state.comedianUnlocked=false;
  state.firstMicPremiseId=null;
  state.firstMicPremiseIds=[];
  state.storySeen=false;
  state.micPrep={changed:false,changeItems:[],showerProgress:0,showered:false,outfit:null,outfitRoast:null,setLocked:false,keysFound:false,keySpot:null,keyAttempts:[],keySearchActive:false};
  state.firstSetScores=[];
  state.firstSetResult=null;
  state.comedy=freshComedyState(true);
  state.employed=true;
  state.firedDay=null;
  state.workWarnings=0;
  state.bossFavorite=false;
  state.promotionOffered=false;
  state.promoted=false;
  state.promotionDeclined=false;
  state.promotionDeclinedDay=null;
  state.jobTitle="Warehouse Worker";
  state.workResponsibility=0;
  state.hourlyPayBonus=0;
  state.day=1;
  state.timeLeft=22;
  state.quota=100;
  state.processed=0;

function renderBoot(){

  ensureCoreSchema();
  state.phase='boot';
  const canLoad=hasSave();
  game.innerHTML=`
    <div class="boot">

      </div>
    </div>`;
  document.getElementById('newGame').onclick=newGame;

      resumeGame();
    };

function resumeGame(){
  if(state.comedianUnlocked){
    revealComedian();
    return;
  }
  if(!state.people.length)SOCIAL_ENGINE.makeStartingPeople();

  // Lab checkpoints intentionally resume at stable scenes, not mid-animation.
  switch(state.phase){
    case 'lunch': lunchBreak(); break;
    case 'after_lunch': finishLunch(SOCIAL_ENGINE.person(state.currentCoworker),true); break;
    case 'evening': renderEveningAfterWork(); break;
    case 'mic_decision': renderMicDecision(); break;
    case 'mic_prep': renderMicDecision(); break;
    case 'driving_to_mic': renderDriveToMic(); break;
    case 'drive_turnaround': renderTurnAroundDecision(); break;
    case 'drive_complete': renderDriveComplete(); break;
    case 'first_mic': renderFirstMicArrival(); break;
    case 'signup_game': renderSignupGame(); break;
    case 'first_set': renderFirstSet(); break;
    case 'first_set_game': startFirstSetGame(); break;
    case 'first_set_result': renderFirstSetResult(); break;
    case 'quit_comedy': renderQuitComedy(); break;
    case 'troy_warning': finishLunch(SOCIAL_ENGINE.person(state.currentCoworker),true); break;
    case 'performance_warning': endShift(true,true); break;
    case 'promotion_offer': renderPromotionOffer(); break;
    case 'promotion_result': renderPromotionResult(!!state.promoted); break;
    case 'weekend': renderWeekend(); break;
    case 'fired': renderFiredAftermath(); break;
    case 'fired_aftermath': renderFiredAftermath(); break;
    case 'unemployed': renderUnemployedNextDay(); break;
    default: renderIntro();
  }
}

const SOCIAL_ENGINE={
  coworkerNames:["Mike","Troy","Ben","Ray","Cole","Nate","Eric","Derek"],
  archetypes:[
    {
      id:"work_buddy",
      label:"Work buddy",
      vibe:"Easy to bullshit with. Laughs when something catches him off guard.",
      reactBias:.16,
      relation:58
    },
    {
      id:"older_coworker",
      label:"Older coworker",
      vibe:"Has been here forever. Knows random things about town and everybody in it.",
      reactBias:.05,
      relation:42
    },
    {
      id:"quiet_guy",
      label:"Quiet coworker",
      vibe:"Does not talk much, but when he laughs you know you actually got him.",
      reactBias:-.05,
      relation:35
    },
    {
      id:"class_clown",
      label:"Funny coworker",
      vibe:"Always joking around. Harder to impress because he thinks he is the funny one.",
      reactBias:-.02,
      relation:50
    },
    {
      id:"boss",
      label:"Supervisor",
      vibe:"Friendly enough, but you are still talking to the person who notices when you screw up.",
      reactBias:-.18,
      relation:34
    }
  ],
  makeStartingPeople(){
    const usedNames=new Set();
    const people=[];

    function uniqueName(engine){
      let name=engine.coworkerNames[Math.floor(Math.random()*engine.coworkerNames.length)];
      while(usedNames.has(name)){
        name=engine.coworkerNames[Math.floor(Math.random()*engine.coworkerNames.length)];
      }
      usedNames.add(name);
      return name;
    }

    // Darren always has a supervisor in his starting work world.
    const bossType=this.archetypes.find(a=>a.id==="boss");
    usedNames.add("Troy");
    // Rare world seed: sometimes Darren is already one of Troy's favorites.
    // The player is never told this directly; it only shows up as unusually
    // high relationship and can later open the promotion branch.
    state.bossFavorite=Math.random() < .08;

    const boss={
      id:"boss_1",
      name:"Troy",
      role:bossType.label,
      personality:"boss",
      vibe:bossType.vibe,
      relationship:state.bossFavorite
        ? 58 + Math.floor(Math.random()*7)
        : Math.max(24,Math.min(48,bossType.relation + Math.floor(Math.random()*9)-4)),
      knowledge:[]
    };

    // Boss may know local stuff, but not reliably.
    if(Math.random() < .28){
      boss.knowledge.push({
        id:"back_room_open_mic",
        type:"open_mic",
        title:"The Back Room Open Mic",
        detail:"Tuesday nights. Sign-up at 7:30.",
        reliability:1
      });
    }
    people.push(boss);

    // Two regular coworkers.
    const coworkerTypes=this.archetypes.filter(a=>a.id!=="boss");
    for(let i=0;i<2;i++){
      const archetype=coworkerTypes[Math.floor(Math.random()*coworkerTypes.length)];
      const coworker={
        id:"coworker_"+(i+1),
        name:uniqueName(this),
        role:archetype.label,
        personality:archetype.id,
        vibe:archetype.vibe,
        relationship:Math.max(20,Math.min(75,archetype.relation + Math.floor(Math.random()*13)-6)),
        knowledge:[]
      };

      const knowChance =
        archetype.id==="older_coworker" ? .70 :
        archetype.id==="work_buddy" ? .52 :
        archetype.id==="class_clown" ? .46 : .32;

      if(Math.random() < knowChance){
        coworker.knowledge.push({
          id:"back_room_open_mic",
          type:"open_mic",
          title:"The Back Room Open Mic",
          detail:"Tuesday nights. Sign-up at 7:30.",
          reliability:1
        });
      }
      people.push(coworker);
    }

    // First-run safety rail:
    // Darren's starting life always contains at least one real route toward comedy.
    // We do NOT tell the player who knows, and they still have to actually
    // interact with that person and get the information out of them.
    const regularCoworkers=people.filter(p=>p.personality!=="boss");
    const regularKnowsMic=regularCoworkers.some(p=>
      (p.knowledge||[]).some(k=>k.id==="back_room_open_mic")
    );

    if(!regularKnowsMic){
      const source=regularCoworkers[Math.floor(Math.random()*regularCoworkers.length)];
      source.knowledge.push({
        id:"back_room_open_mic",
        type:"open_mic",
        title:"The Back Room Open Mic",
        detail:"Tuesday nights. Sign-up at 7:30.",
        reliability:1
      });
    }

    state.people=people;
    state.currentCoworker=null;
    state.lastCoworkerId=null;
    state.lunchDay=null;
  },
  chooseLunchCoworker(){
    if(!state.people.length)this.makeStartingPeople();

    const boss=state.people.find(p=>p.personality==="boss");
    const coworkers=state.people.filter(p=>p.personality!=="boss");

    // Poor work performance makes it increasingly likely the supervisor
    // is the person Darren has to deal with at lunch.
    const trouble=this.workTrouble();

    // Troy should feel like a consequence, not the default lunch partner.
    // Good shift: ~5%. Rough shift: climbs, but caps around one-third.
    const bossChance=Math.min(.35,.05 + trouble*.30);

    let chosen=null;

    if(boss && Math.random() < bossChance){
      chosen=boss;
    }else{
      let pool=coworkers.length ? coworkers : state.people;

      // Prefer not to repeat yesterday's lunch person when another option exists.
      if(pool.length>1 && state.lastCoworkerId){
        const filtered=pool.filter(p=>p.id!==state.lastCoworkerId);
        if(filtered.length)pool=filtered;
      }

      chosen=pool[Math.floor(Math.random()*pool.length)];
    }

    state.currentCoworker=chosen.id;
    state.lastCoworkerId=chosen.id;
    state.lunchDay=state.day;
    return chosen;
  },
  person(id){return state.people.find(p=>p.id===id)||null;},
  knows(id){return state.knownInfo.some(k=>k.id===id);},
  learnedToday(id){
    const item=state.knownInfo.find(k=>k.id===id);
    return !!item && item.learnedDay===state.day;
  },
  workTrouble(){
    const paceDamage=Math.max(0,(75-state.quota)/75);
    const missDamage=Math.min(1,state.misses/4);
    return Math.min(1,(paceDamage*.45)+(missDamage*.75));
  },
  learn(person,knowledge){
    if(!knowledge || this.knows(knowledge.id))return false;
    state.knownInfo.push({
      ...knowledge,
      sourcePersonId:person.id,
      learnedDay:state.day
    });
    if(knowledge.type==="open_mic" && !state.opportunities.some(o=>o.id===knowledge.id)){
      state.opportunities.push({
        id:knowledge.id,
        type:"open_mic",
        title:knowledge.title,
        sourcePersonId:person.id,
        unlocked:true
      });
    }
    return true;
  },
  addPremise(text){
    let premise=state.premises.find(p=>p.text===text);
    if(premise)return premise;

    premise={
      id:"premise_"+Date.now()+"_"+Math.floor(Math.random()*10000),
      text,
      status:"premise",
      createdDay:state.day,
      reactions:[]
    };
    state.premises.push(premise);
    return premise;
  },
  recordMaterialFeedback(thought,person,result){
    const item={
      thought,
      personId:person.id,
      personName:person.name,
      day:state.day,
      result,
      positive:(result==="big_laugh" || result==="small_laugh")
    };
    state.materialFeedback.push(item);

    const premise=this.addPremise(thought);
    premise.reactions.push({
      personId:person.id,
      personName:person.name,
      day:state.day,
      result,
      positive:item.positive
    });

    return item;
  },
  feedbackFor(thought){
    return state.materialFeedback.filter(f=>f.thought===thought);
  },
  untoldPremisesFor(person){
    if(!person)return [];
    return state.premises.filter(p=>{
      const reactions=p.reactions||[];
      return !reactions.some(r=>r.personId===person.id);
    });
  }
};


function unlockSocialActionsAfterDelay(delay=900){
  const actions=document.getElementById('socialActions');
  if(!actions)return;

  actions.classList.add('locked');

  const buttons=actions.querySelectorAll('button');
  buttons.forEach(btn=>{
    if(!btn.dataset.originalDisabled){
      btn.dataset.originalDisabled=btn.disabled ? "1" : "0";
    }
    btn.disabled=true;
  });

  setTimeout(()=>{
    const current=document.getElementById('socialActions');
    if(!current)return;

    current.classList.remove('locked');
    current.querySelectorAll('button').forEach(btn=>{
      const wasDisabled=btn.dataset.originalDisabled==="1";
      btn.disabled=wasDisabled;
      delete btn.dataset.originalDisabled;
    });
  },delay);
}

}

let tickTimer=null;
let boxTimer=null;
let thoughtTimer=null;
let thoughtHideTimer=null;
let scanOpenTimer=null;
let scanCloseTimer=null;
let boxScannable=false;
let thoughtActive=false;
let currentThought='';

function startShift(){
  state.phase='work';
  saveGame();
  state.timeLeft=22;
  state.quota=100;
  state.processed=0;
  state.misses=0;
  state.savedThoughts=[];
  state.thoughtsShown=0;
  // Three designed beats per shift with tiny timing variation.
  state.thoughtTriggers=[
    17 + Math.floor(Math.random()*2),   // early
    11 + Math.floor(Math.random()*3)-1, // middle
    5  + Math.floor(Math.random()*2)    // late
  ];
  state.nextThoughtTrigger=0;
  thoughtActive=false;
  state.writingThought=false;
  currentThought='';
  clearTimeout(thoughtTimer);
  clearTimeout(thoughtHideTimer);
  renderWork();
  spawnBox();
  tickTimer=setInterval(()=>{
    state.timeLeft--;
    state.quota=Math.max(0,state.quota-1.4);
    maybeTriggerThought();
    updateHUD();
    if(state.timeLeft<=0)lunchBreak();
  },1000);
}

function updateHUD(){
  const t=document.getElementById('time');
  const fill=document.getElementById('lineFill');
  const meter=document.getElementById('lineMeter');

  if(t)t.textContent=Math.max(0,state.timeLeft);

  const health=Math.max(0,Math.min(100,state.quota));
  if(fill)fill.style.width=health+'%';
  if(meter)meter.classList.toggle('danger',health<45);
}
function setScanReady(ready){
  boxScannable=ready;
  const scan=document.getElementById('scan');
  const station=document.querySelector('.station');

  if(station)station.classList.toggle('scan-ready',ready);
  if(scan){
    scan.disabled=!ready || state.writingThought;
    scan.textContent='SCAN';
  }
}

const boxCardboardClasses=["box-blue","box-orange","box-purple","box-green","box-pink"];

function randomizeBoxCardboard(){
  const box=document.getElementById('box');
  if(!box)return;
  boxCardboardClasses.forEach(c=>box.classList.remove(c));
  box.classList.add(boxCardboardClasses[Math.floor(Math.random()*boxCardboardClasses.length)]);
}

function arcadeFeedback(kind,msg){
  const station=document.getElementById('station');
  const f=document.getElementById('feedback');

  if(f){
    f.textContent=msg;
    f.classList.remove('good','bad');
    if(kind)f.classList.add(kind);
  }

  if(station){
    station.classList.remove('scan-hit','miss-hit');
    void station.offsetWidth;
    station.classList.add(kind==="good"?'scan-hit':'miss-hit');
  }
}

function spawnBox(){
  randomizeBoxCardboard();
  clearTimeout(boxTimer);
  clearTimeout(scanOpenTimer);
  clearTimeout(scanCloseTimer);
  setScanReady(false);

  if(state.phase!=='work')return;
  const box=document.getElementById('box');
  if(!box)return;

  box.classList.remove('travel','scanned','go');
  void box.offsetWidth;
  box.classList.add('travel');

  // The box can only be scanned while it is physically parked in the middle.
  scanOpenTimer=setTimeout(()=>{
    if(state.phase==='work')setScanReady(true);
  },820);

  scanCloseTimer=setTimeout(()=>{
    if(state.phase==='work')setScanReady(false);
  },1600);

  boxTimer=setTimeout(()=>{
    if(state.phase!=='work')return;
    setScanReady(false);
    state.quota=Math.max(0,state.quota-8);
    state.misses++;
    arcadeFeedback('bad',"Missed it.");
    updateHUD();
    spawnBox();
  },2400);
}

function scanBox(){
  if(state.phase!=='work' || state.writingThought)return;
  if(!boxScannable){
    arcadeFeedback("bad","Not yet.");
    return;
  }

  setScanReady(false);
  clearTimeout(boxTimer);
  clearTimeout(scanOpenTimer);
  clearTimeout(scanCloseTimer);
  state.processed++;
  state.quota=Math.min(100,state.quota+10);
  arcadeFeedback('good',"BEEP.");

  const box=document.getElementById('box');
  if(box){
    const rect=box.getBoundingClientRect();
    box.classList.remove('travel');
    box.style.left=rect.left+'px';
    box.style.top=rect.top+'px';
    box.style.transform='none';
    box.style.position='fixed';
    box.classList.add('scanned');

    requestAnimationFrame(()=>{
      box.classList.add('go');
    });

    setTimeout(()=>{
      box.style.position='';
      box.style.left='';
      box.style.top='';
      box.style.transform='';
      box.classList.remove('scanned','go');
      spawnBox();
    },220);
  }else{
    spawnBox();
  }

  updateHUD();
}

function maybeTriggerThought(){
  if(state.phase!=='work' || thoughtActive)return;
  if(state.nextThoughtTrigger>=state.thoughtTriggers.length)return;
  const trigger=state.thoughtTriggers[state.nextThoughtTrigger];
  if(state.timeLeft<=trigger){
    state.nextThoughtTrigger++;
    showThought();
  }
}

function showThought(){
  if(thoughtActive)return;
  const knownPremises=new Set(state.premises.map(p=>p.text));
  const pool=thoughts.filter(t=>!state.savedThoughts.includes(t) && !knownPremises.has(t));
  if(!pool.length)return;
  currentThought=pool[Math.floor(Math.random()*pool.length)];
  state.thoughtsShown++;
  thoughtActive=true;
  const el=document.getElementById('thought');
  const txt=document.getElementById('thoughtText');
  const keep=document.getElementById('keep');
  if(txt)txt.textContent=currentThought;
  if(el){
    el.classList.remove('show');
    void el.offsetWidth;
    el.classList.add('show');
  }
  if(keep)keep.disabled=false;
  clearTimeout(thoughtHideTimer);
  thoughtHideTimer=setTimeout(()=>hideThought(true),5200);
}

function hideThought(expired){
  if(state.writingThought)return;
  thoughtActive=false;
  const el=document.getElementById('thought');
  const keep=document.getElementById('keep');
  if(el)el.classList.remove('show');
  if(keep)keep.disabled=true;
  if(expired)arcadeFeedback("bad","Lost it.");
  currentThought='';
}

function showIdeaSaved(text){
  const bank=document.getElementById('ideaCount');
  if(bank)bank.textContent=state.premises.length;
  const station=document.getElementById('station');
  if(!station || !text)return;
  const pop=document.createElement('div');
  pop.className='idea-saved-pop';
  const short=text.length>90?text.slice(0,87)+'…':text;
  pop.innerHTML='<small>✓ IDEA SAVED TO NOTEBOOK</small>'+escapeHtml(short);
  station.appendChild(pop);
  setTimeout(()=>pop.remove(),1400);
}

function keepThought(){
  if(!thoughtActive || !currentThought || state.writingThought)return;

  state.writingThought=true;
  clearTimeout(thoughtHideTimer);

  const keep=document.getElementById('keep');
  const scan=document.getElementById('scan');
  const station=document.querySelector('.station');

  if(keep){
    keep.disabled=true;
    keep.textContent='WRITING...';
    keep.classList.add('writing');
  }
  if(scan)scan.disabled=true;
  if(station)station.classList.add('writing');

  arcadeFeedback("good","Writing it down...");

  // The conveyor does NOT stop. This is the cost of saving the thought.
  setTimeout(()=>{
    if(state.phase!=='work')return;

    const saved=currentThought;
    if(saved){
      state.savedThoughts.push(saved);
      SOCIAL_ENGINE.addPremise(saved);
      saveGame();
      showIdeaSaved(saved);
    }

    state.writingThought=false;
    thoughtActive=false;
    currentThought='';

    const el=document.getElementById('thought');
    if(el)el.classList.remove('show');

    if(keep){
      keep.classList.remove('writing');
      keep.textContent='WRITE IT DOWN';
      keep.disabled=true;
    }
    if(scan)scan.disabled=!boxScannable;
    if(station)station.classList.remove('writing');

    flash(saved ? "In the notebook. Catch up." : "You lost it halfway through.");
    updateHUD();
  },1350);
}

function makeSmallTalk(person){
  const actions=document.getElementById('socialActions');
  if(actions)actions.innerHTML='';

  const reaction=document.getElementById('reaction');
  const info=(person.knowledge||[]).find(k=>k.id==="back_room_open_mic");
  const canDiscover=info && !SOCIAL_ENGINE.knows("back_room_open_mic");

  // This is an explicit conversation now. Discovery can happen here,
  // never from Darren silently eating.
  const relationshipBonus=Math.max(0,Math.min(.18,(person.relationship-35)/220));
  const bossPenalty=person.personality==="boss" ? .10 : 0;
  const discoverChance=Math.max(.16,Math.min(.58,.34+relationshipBonus-bossPenalty));

  if(canDiscover && Math.random()<discoverChance){
    SOCIAL_ENGINE.learn(person,info);
    saveGame();

    if(reaction){
      reaction.innerHTML=`
        <div class="reaction">
          You make small talk for a minute. ${escapeHtml(person.name)} says,
          “You ever been to The Back Room? They do an open mic there Tuesdays.”
        </div>
        <div class="knowledge">
          You learned about <strong>${escapeHtml(info.title)}</strong><br>
          <span class="mut">${escapeHtml(info.detail)}</span>
        </div>
        <button class="action" id="smallTalkContinue" style="margin-top:12px">BACK TO WORK</button>
      `;
      document.getElementById('smallTalkContinue').onclick=()=>finishLunch(person,true);
      return;
    }
  }

  if(reaction){
    reaction.innerHTML=`
      <div class="reaction">
        You talk about work for a minute. Nothing important comes up.
      </div>
      <button class="action" id="smallTalkContinue" style="margin-top:12px">BACK TO WORK</button>
    `;
    document.getElementById('smallTalkContinue').onclick=()=>finishLunch(person,false);
    return;
  }

  finishLunch(person,false);
}

function runThoughtOnCoworker(person,thought){
  const actions=document.getElementById('socialActions');
  if(actions)actions.innerHTML='';

  const personality = SOCIAL_ENGINE.archetypes.find(a=>a.id===person.personality);
  const base=.54 + (person.relationship-40)/180 + (personality?personality.reactBias:0);
  const roll=Math.random();
  let reactionText='';
  let strongLaugh=false;

  let materialResult="miss";

  if(roll < base*.45){
    reactionText=person.personality==="boss"
      ? `${person.name} actually laughs. That feels weirdly more important than it should.`
      : `${person.name} laughs immediately. Not politely. You feel the difference.`;
    strongLaugh=true;
    materialResult="big_laugh";
    person.relationship=Math.min(100,person.relationship+5);
    state.hidden.confidence=Math.min(1,state.hidden.confidence+.025);
  }else if(roll < base){
    reactionText=person.personality==="boss"
      ? `${person.name} cracks a smile. “Alright, that was pretty good.”`
      : `${person.name} smiles. “That’s actually pretty funny.”`;
    materialResult="small_laugh";
    person.relationship=Math.min(100,person.relationship+2);
    state.hidden.confidence=Math.min(1,state.hidden.confidence+.01);
  }else{
    if(person.personality==="boss"){
      reactionText=`${person.name} looks at you for a second. “You done with that pallet yet?”`;
      person.relationship=Math.max(0,person.relationship-1);
    }else{
      reactionText=`${person.name} gives you the little nose-exhale people do when they are being generous.`;
    }
  }

  SOCIAL_ENGINE.recordMaterialFeedback(thought,person,materialResult);
  saveGame();

  // Troy is dangerous, but firing should normally be earned through a pattern:
  // poor work + bad interaction and/or an existing warning.
  if(person.name==="Troy" && person.personality==="boss"){
    const trouble=SOCIAL_ENGINE.workTrouble();
    const relationshipRisk=Math.max(0,(45-person.relationship)/45);

    let fireChance=0;

    // Without a prior warning, instant firing is reserved for a genuinely awful shift.
    if(state.workWarnings===0){
      if(trouble>.72 && materialResult==="miss"){
        fireChance=.06 + (trouble-.72)*.32 + relationshipRisk*.06;
      }

      // More commonly, Troy gives you a warning instead.
      let warningChance=.03 + trouble*.28 + relationshipRisk*.08;
      if(materialResult==="miss")warningChance+=.10;
      if(materialResult==="big_laugh")warningChance-=.05;
      warningChance=Math.max(0,Math.min(.48,warningChance));

      if(Math.random() < warningChance){
        state.workWarnings=1;
        person.relationship=Math.max(0,person.relationship-4);
        saveGame();
        showTroyWarning(person,materialResult);
        return;
      }
    }else{
      // Once Darren has been warned, screwing around on another rough shift is risky.
      fireChance=.015;
      fireChance += trouble*.22;
      fireChance += relationshipRisk*.08;
      if(materialResult==="miss")fireChance+=.07;
      if(materialResult==="small_laugh")fireChance+=.01;
      if(materialResult==="big_laugh")fireChance-=.02;
    }

    fireChance=Math.max(0,Math.min(.32,fireChance));

    if(Math.random() < fireChance){
      fireFromWarehouse(person,thought,materialResult,fireChance);
      return;
    }
  }

  const reaction=document.getElementById('reaction');
  if(reaction){
    const materialNote = materialResult==="big_laugh"
      ? "That idea got a real laugh."
      : materialResult==="small_laugh"
        ? "That idea got something."
        : "That idea did not really work on him.";

    reaction.innerHTML=`
      <div class="reaction">${escapeHtml(reactionText)}</div>
      <div class="knowledge">
        ${escapeHtml(materialNote)}
      </div>`;
  }

  setTimeout(()=>{
    maybeShareComedyKnowledge(person,strongLaugh,materialResult);
  },700);
}

];
const KEY_SPOTS=['Kitchen counter','Work pants','Couch cushions','Bathroom sink','Nightstand','Jacket pocket'];

function freshMicPrep(){
  return {changed:false,changeItems:[],showerProgress:0,showered:false,outfit:null,outfitRoast:null,setLocked:false,keysFound:false,keySpot:null,keyAttempts:[],keySearchActive:false};

function prepStep(){
  if(!state.micPrep.changed)return 'change';
  if(!state.micPrep.showered)return 'shower';
  if(!state.micPrep.outfit)return 'outfit';
  if(!state.micPrep.setLocked)return 'set';
  if(!state.micPrep.keysFound)return 'keys';
  return 'leave';
}
function prepProgressHTML(active){
  const steps=[['change','CHANGE'],['shower','SHOWER'],['outfit','OUTFIT'],['set','SET'],['keys','KEYS']];
  const order=steps.map(x=>x[0]);
  const ai=order.indexOf(active);
  return `<div class="prep-progress-row">${steps.map(([id,label],i)=>`<div class="prep-dot ${i<ai||active==='leave'?'done':''} ${id===active?'active':''}">${label}</div>`).join('')}</div>`;
}

  state.phase='mic_prep';
  ensureCoreSchema();
  saveGame();

  const step=prepStep();
  const selected=getSelectedMicPremises();
  const outfit=OUTFIT_OPTIONS.find(o=>o.id===state.micPrep.outfit);

  }else if(step==='outfit'){
    body=`<div class="prep-game"><h2>What are you wearing?</h2><p>This should not feel like a major decision. It does.</p><div class="prep-grid">${OUTFIT_OPTIONS.map(o=>`<button class="prep-choice outfit" data-outfit="${o.id}">${escapeHtml(o.name)}<small>${escapeHtml(o.note)}</small></button>`).join('')}</div></div>`;
  }else if(step==='set'){

    </div>`;
  }else if(step==='keys'){

    body=`<div class="prep-game"><h2>Okay. Go.</h2><p>You are clean, dressed, have a set, and somehow found your keys.</p>${outfit?`<div class="outfit-summary">${escapeHtml(outfit.name)}</div>`:''}${selected.length?`<div class="prep-status">SET: ${selected.map(p=>`“${escapeHtml(p.text)}”`).join(' • ')}</div>`:`<div class="prep-status">SET: absolutely nothing</div>`}<button class="action" id="leaveForMic">LEAVE FOR THE BACK ROOM</button></div>`;
  }

  game.innerHTML=topbar()+`<div class="screen"><div class="prep-shell"><div class="eyebrow">${weekdayName().toUpperCase()} • 6:58 PM</div><h1>You’re home.</h1><div class="copy">The mic starts at 8:00. Going to it now requires several tiny acts of commitment.</div>${prepProgressHTML(step)}${body}<button class="boot-btn" id="stayHome">DON’T GO</button></div></div>`;

  document.querySelectorAll('[data-change]').forEach(btn=>btn.onclick=()=>{
    const item=btn.dataset.change;
    const items=new Set(state.micPrep.changeItems||[]);items.add(item);state.micPrep.changeItems=[...items];
    if(items.has('shirt')&&items.has('boots'))state.micPrep.changed=true;
    saveGame();renderMicDecision();
  });
  const shower=document.getElementById('showerAction');
  if(shower)shower.onclick=()=>{state.micPrep.showerProgress=Math.min(3,(state.micPrep.showerProgress||0)+1);if(state.micPrep.showerProgress>=3)state.micPrep.showered=true;saveGame();renderMicDecision();};
  document.querySelectorAll('[data-outfit]').forEach(btn=>btn.onclick=()=>{
    const o=OUTFIT_OPTIONS.find(x=>x.id===btn.dataset.outfit);if(!o)return;
    state.micPrep.outfit=o.id;state.micPrep.outfitRoast=o.roast||null;saveGame();renderMicDecision();
  });
  document.querySelectorAll('.note-choice').forEach(btn=>btn.onclick=()=>toggleMicPremise(btn.dataset.premiseId));
  const lock=document.getElementById('lockSet');
  if(lock)lock.onclick=()=>{state.micPrep.setLocked=true;saveGame();renderMicDecision();};
  document.querySelectorAll('[data-keyspot]').forEach(btn=>btn.onclick=()=>{
    const i=Number(btn.dataset.keyspot);
    if(i===state.micPrep.keySpot){state.micPrep.keysFound=true;saveGame();renderMicDecision();return;}
    if(!state.micPrep.keyAttempts.includes(i))state.micPrep.keyAttempts.push(i);
    saveGame();renderMicDecision();
  });
  const leave=document.getElementById('leaveForMic');
  if(leave)leave.onclick=state.firstMicDone && !state.comedianUnlocked ? commitToComedy : renderDriveToMic;
  document.getElementById('stayHome').onclick=()=>{
    state.micPrep=freshMicPrep();state.firstMicPremiseId=null;state.firstMicPremiseIds=[];advanceOneDay();
  };
}

function toggleMicPremise(id){
  if(!Array.isArray(state.firstMicPremiseIds))state.firstMicPremiseIds=[];
  const ix=state.firstMicPremiseIds.indexOf(id);
  if(ix>=0)state.firstMicPremiseIds.splice(ix,1);
  else if(state.firstMicPremiseIds.length<3)state.firstMicPremiseIds.push(id);
  state.firstMicPremiseId=state.firstMicPremiseIds[0]||null;
  saveGame();renderMicDecision();
}


function micPremiseScore(p){
  const reactions=p.reactions||[];
  let score=0;

  reactions.forEach(r=>{
    if(r.result==="big_laugh")score+=4;
    else if(r.result==="small_laugh")score+=2;
    else if(r.result==="miss")score-=1;
  });

  // Recent ideas stay mentally available even if they haven't been tested yet.
  score += Math.max(0,3-((state.day-(p.createdDay||state.day))*.35));
  return score;
}

function micPremisesToShow(){
  if(!state.premises.length)return [];

  const ranked=state.premises
    .slice()
    .sort((a,b)=>
      (micPremiseScore(b)-micPremiseScore(a)) ||
      ((b.createdDay||0)-(a.createdDay||0))
    );

  let shown=ranked.slice(0,5);

  // Never hide the player's already-selected premise on a resumed prep screen.
  if(state.firstMicPremiseId && !shown.some(p=>p.id===state.firstMicPremiseId)){
    const selected=state.premises.find(p=>p.id===state.firstMicPremiseId);
    if(selected){
      shown=shown.slice(0,4);
      shown.push(selected);
    }
  }

  return shown;
}

function renderMicPremiseChoices(){
  if(!state.premises.length){
    return `<div class="mut" style="color:#6f675b">There is nothing in here yet. You can still go up with nothing.</div>`;
  }
  const shown=micPremisesToShow();
  const selected=new Set(state.firstMicPremiseIds||[]);
  return `<div class="notebook-count">${selected.size}/3 JOKES IN TONIGHT'S SET</div><div class="notes-list">${shown.map(p=>`
    <button class="note-choice ${selected.has(p.id)?'selected':''}" data-premise-id="${escapeHtml(p.id)}" ${!selected.has(p.id)&&selected.size>=3?'disabled':''}>
      ${selected.has(p.id)?'✓ ':''}“${escapeHtml(p.text)}”
    </button>`).join('')}</div>${state.premises.length>shown.length?`<div style="margin-top:8px;color:#756d60;font-size:11px">More notes exist. These are the ones that come to mind tonight.</div>`:''}`;
}

let driveAnimFrame=null;
let driveStartTime=0;
let driveLastTime=0;
let driveLane=1;
let driveObstacles=[];
let driveNextSpawn=0;
let driveHits=0;
const DRIVE_DURATION=8.0;
const DRIVE_LANES=[16.7,50,83.3];

function stopDriveGame(){
  if(driveAnimFrame){
    cancelAnimationFrame(driveAnimFrame);
    driveAnimFrame=null;
  }
  driveObstacles=[];
}

function renderDriveToMic(){
  stopDriveGame();
  state.phase='driving_to_mic';
  saveGame();

  game.innerHTML=topbar()+`
    <div class="screen">
      <div class="drive-shell">
        <div class="work-head">
          <div>
            <div class="small">7:16 PM • ON THE WAY</div>
            <div class="shift-title">Just get there.</div>
          </div>
        </div>

        <div class="drive-hud">
          <div class="drive-progress"><div id="driveProgress"></div></div>
          <div class="drive-time"><span id="driveTime">8.0</span>s</div>
        </div>

        <div class="drive-road" id="driveRoad">
          <div class="drive-car" id="driveCar"></div>
        </div>

        <div class="drive-message" id="driveMessage">
          Don’t turn around. Also don’t hit anybody.
        </div>

        <div class="drive-controls">
          <button id="driveLeft">← LEFT</button>
          <button id="driveRight">RIGHT →</button>
          <button id="driveTurnAround" style="grid-column:1/-1;background:#21161a;color:#f2c6ce;font-size:14px">TURN AROUND</button>
        </div>

  document.getElementById('driveLeft').onclick=()=>moveDriveLane(-1);
  document.getElementById('driveRight').onclick=()=>moveDriveLane(1);
  document.getElementById('driveTurnAround').onclick=renderTurnAroundDecision;

  driveLane=1;
  driveHits=0;
  driveObstacles=[];
  driveStartTime=performance.now();
  driveLastTime=driveStartTime;
  driveNextSpawn=.55;
  updateDriveCar();
  driveAnimFrame=requestAnimationFrame(driveFrame);
}

function moveDriveLane(dir){
  driveLane=Math.max(0,Math.min(2,driveLane+dir));
  updateDriveCar();
}

function updateDriveCar(){
  const car=document.getElementById('driveCar');
  if(car)car.style.left=DRIVE_LANES[driveLane]+'%';
}

function spawnTrafficCar(){
  const road=document.getElementById('driveRoad');
  if(!road)return;

  let lane=Math.floor(Math.random()*3);

  // Don't repeatedly spawn in the exact same lane if there are options.
  const closeLanes=driveObstacles
    .filter(o=>o.y<150)
    .map(o=>o.lane);
  if(closeLanes.includes(lane)){
    const options=[0,1,2].filter(x=>!closeLanes.includes(x));
    if(options.length)lane=options[Math.floor(Math.random()*options.length)];
  }

  const el=document.createElement('div');
  el.className='traffic-car';
  el.style.left=DRIVE_LANES[lane]+'%';
  road.appendChild(el);

  driveObstacles.push({
    el,lane,y:-90,speed:205+Math.random()*45,hit:false
  });
}

function driveFrame(now){
  const dt=Math.min(.05,(now-driveLastTime)/1000);
  driveLastTime=now;
  const elapsed=(now-driveStartTime)/1000;

  const progress=document.getElementById('driveProgress');
  const time=document.getElementById('driveTime');
  if(progress)progress.style.width=Math.min(100,(elapsed/DRIVE_DURATION)*100)+'%';
  if(time)time.textContent=Math.max(0,DRIVE_DURATION-elapsed).toFixed(1);

  if(elapsed>=driveNextSpawn && elapsed<DRIVE_DURATION-1.0){
    spawnTrafficCar();
    driveNextSpawn=elapsed + .72 + Math.random()*.42;
  }

  const road=document.getElementById('driveRoad');
  const roadHeight=road ? road.clientHeight : 430;

  driveObstacles.forEach(o=>{
    o.y += o.speed*dt;
    if(o.el)o.el.style.top=o.y+'px';

    // Player car occupies roughly bottom 24..110px of road.
    const collisionY=roadHeight-120;
    if(!o.hit && o.lane===driveLane && o.y>collisionY && o.y<roadHeight-18){
      o.hit=true;
      driveHits++;
      driveCollisionFeedback();
    }
  });

  driveObstacles=driveObstacles.filter(o=>{
    if(o.y>roadHeight+100){
      if(o.el)o.el.remove();
      return false;
    }
    return true;
  });

  if(elapsed>=DRIVE_DURATION){
    stopDriveGame();
    renderDriveComplete();
    return;
  }

  driveAnimFrame=requestAnimationFrame(driveFrame);
}

function driveCollisionFeedback(){
  const road=document.getElementById('driveRoad');
  const msg=document.getElementById('driveMessage');

  if(road){
    road.classList.remove('hit');
    void road.offsetWidth;
    road.classList.add('hit');
  }
  if(msg){
    msg.classList.add('hit');
    msg.textContent=driveHits===1 ? 'HONK. Jesus.' : 'Okay. Eyes on the road.';
    setTimeout(()=>{
      if(document.getElementById('driveMessage')){
        msg.classList.remove('hit');
        msg.textContent='Just get there.';
      }
    },650);
  }
}

let signupAnimFrame=null;
let signupHolding=false;
let signupProgress=0;
let signupLastTime=0;
const SIGNUP_HOLD_SECONDS=1.35;

function stopSignupGame(){
  signupHolding=false;
  if(signupAnimFrame){
    cancelAnimationFrame(signupAnimFrame);
    signupAnimFrame=null;
  }
}

function renderFirstMicArrival(){
  stopSignupGame();

        <button class="action" id="signUp">TAKE THE CLIPBOARD</button>
        <button class="boot-btn" id="leave">GO BACK TO YOUR CAR</button>
      </div>
    </div>`;

  document.getElementById('signUp').onclick=renderSignupGame;
  document.getElementById('leave').onclick=renderMicDecision;
}

function renderSignupGame(){
  stopSignupGame();
  state.phase='signup_game';
  saveGame();

  signupProgress=0;

  game.innerHTML=topbar()+`
    <div class="screen">
      <div class="signup-shell">
        <div class="work-head">
          <div>
            <div class="small">7:35 PM • SIGN-UP</div>
            <div class="shift-title">Put your name down.</div>
          </div>
        </div>

        <div class="clipboard">
          <div class="signup-paper">
            <div class="signup-title">THE BACK ROOM — OPEN MIC</div>
            <div class="signup-line">1. Kyle</div>
            <div class="signup-line">2. Maria</div>
            <div class="signup-line">3. Sean</div>
            <div class="signup-line you" id="signupName">4. </div>

            <div class="signup-progress">
              <div id="signupProgress"></div>
            </div>
          </div>
        </div>

        <button class="hold-sign" id="holdSign">HOLD TO WRITE YOUR NAME</button>
        <div class="signup-hint">You can still put the clipboard back.</div>
        <button class="boot-btn" id="signupLeave">PUT IT BACK</button>
      </div>
    </div>`;

  const hold=document.getElementById('holdSign');
  const leave=document.getElementById('signupLeave');

  const begin=(e)=>{
    if(e)e.preventDefault();
    signupHolding=true;
    hold.classList.add('holding');
    hold.textContent='KEEP WRITING...';
    signupLastTime=performance.now();
    if(!signupAnimFrame)signupAnimFrame=requestAnimationFrame(signupFrame);
  };

  const end=(e)=>{
    if(e)e.preventDefault();
    signupHolding=false;
    hold.classList.remove('holding');
    hold.textContent='HOLD TO WRITE YOUR NAME';
  };

  hold.addEventListener('pointerdown',begin);
  hold.addEventListener('pointerup',end);
  hold.addEventListener('pointercancel',end);
  hold.addEventListener('pointerleave',end);

  leave.onclick=()=>{
    stopSignupGame();
    renderFirstMicArrival();
  };
}

function signupFrame(now){
  const dt=Math.min(.05,(now-signupLastTime)/1000);
  signupLastTime=now;

  if(signupHolding){
    signupProgress += dt/SIGNUP_HOLD_SECONDS;
  }else{
    // Hesitating doesn't instantly erase progress, but the pen drifts backward.
    signupProgress -= dt*.16;
  }

  signupProgress=Math.max(0,Math.min(1,signupProgress));

  const bar=document.getElementById('signupProgress');
  const name=document.getElementById('signupName');
  if(bar)bar.style.width=(signupProgress*100)+'%';

  if(name){
    const letters="DARREN";
    const count=Math.min(letters.length,Math.floor(signupProgress*(letters.length+0.99)));
    name.textContent='4. '+letters.slice(0,count);
  }

  if(signupProgress>=1){
    stopSignupGame();
    state.phase='first_set';
    saveGame();
    renderFirstSet();
    return;
  }

  signupAnimFrame=requestAnimationFrame(signupFrame);
}

const STAGE_REACTIONS=["BOMB","NOTHING","LITTLE LAUGH","LAUGH","BIG LAUGH","HUGE LAUGH","ROOM POPS"];
let activeStageSessionId=null;

function stopStageCore(){
  const frame=document.getElementById('stageCoreFrame');
  if(frame){try{frame.src='about:blank';}catch(e){}}
  activeStageSessionId=null;
}
function decodeStageCoreTemplate(){
  const binary=atob(STAGE_CORE_V1_B64);
  const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));
  return new TextDecoder().decode(bytes);
}
function clamp01(v){return Math.max(0,Math.min(1,v))}

function getSelectedMicPremises(){
  const ids=Array.isArray(state.firstMicPremiseIds)?state.firstMicPremiseIds:[];
  const chosen=ids.map(id=>state.premises.find(p=>p.id===id)).filter(Boolean);
  if(chosen.length)return chosen;
  if(state.firstMicPremiseId){
    const one=state.premises.find(p=>p.id===state.firstMicPremiseId);
    if(one)return [one];
  }
  return [];
}
function getFirstMicPremise(){
  return getSelectedMicPremises()[0] || null;
}
function stageMaterialName(p){
  if(!p)return "NO MATERIAL";
  const words=(p.text||"").replace(/[^A-Za-z0-9' ]+/g,' ').trim().split(/\s+/).filter(Boolean);
  return words.length?words.slice(0,Math.min(3,words.length)).join(" "):"WRITTEN BIT";
}
function stageQualityFromPremise(p){
  if(!p)return 0;
  const reactions=p.reactions||[];
  let quality=2;
  reactions.forEach(r=>{
    if(r.result==="big_laugh")quality+=.35;
    else if(r.result==="small_laugh")quality+=.16;
    else if(r.result==="miss")quality-=.14;
  });
  return Math.max(1,Math.min(4,quality));
}
function buildBeginningStageInput(){
  ensureCoreSchema();

  const premises=getSelectedMicPremises();
  const comedy=state.comedy;
  const crowd=comedy.crowds.back_room_tuesday;
  const isFirstEver=comedy.totalSets===0;

  const material=premises.map(premise=>({
    id:premise.id,
    premiseId:premise.id,
    revision:Number.isFinite(premise.revision)?premise.revision:0,
    name:stageMaterialName(premise),
    text:premise.text,
    quality:stageQualityFromPremise(premise),
    tested:(premise.reactions||[]).length
  }));

  const sessionId="beginning-stage-"+Date.now()+"-"+Math.random().toString(36).slice(2);

  return {
    version:1,
    sessionId,
    comic:{
      id:"darren",
      totalSets:comedy.totalSets,
      condition:{
        confidence:state.hidden.confidence,
        nerves:state.hidden.nerves,
        focus:1,
        energy:1,
        intoxication:comedy.preShow.intoxication||0
      },
      skills:{
        stagePresence:comedy.skills.stagePresence,
        timeSense:comedy.skills.timeSense,
        riffing:comedy.skills.riffing
      },
      traits:{phenom:!!comedy.traits.phenom},
      unlocks:{
        killing:!!comedy.unlocks.killing,
        crushing:!!comedy.unlocks.crushing
      }
    },
    role:{
      type:"open_mic",
      allottedSeconds:60,
      lightAt:10,
      hardCutOvertime:15,
      runLightSeverity:.25
    },
    crowd:{
      id:crowd.id,
      forgiveness:crowd.forgiveness,
      firstTimeBonus:isFirstEver?.24:0,
      returningRate:crowd.returningRate,
      repeatTolerance:crowd.repeatTolerance,
      memory:JSON.parse(JSON.stringify(crowd.memory||{}))
    },
    material,
    preShow:JSON.parse(JSON.stringify(comedy.preShow||defaultPreShowState())),
    context:{
      isFirstEver,
      week:comedy.totalSets+1,
      audienceKnowsFirstTimer:isFirstEver
    }
  };
}

function renderFirstSet(){
  state.phase='first_set';
  state.firstSetResult=null;
  saveGame();

  const premises=getSelectedMicPremises();
  game.innerHTML=topbar()+`
    <div class="screen">
      <div class="card">
        <div class="eyebrow">9:12 PM</div>
        <h1>Your name gets called.</h1>
        <div class="copy">You hear “Darren” and stand up before you can decide not to.</div>
        <div class="end-note">
          ${premises.length
            ? premises.map((p,i)=>`${i+1}. <em>“${escapeHtml(p.text)}”</em>`).join('<br><br>')
            : `You have no material. You are about to discover why that matters.`}
        </div>
        <button class="action" id="stepOnStage">STEP ON STAGE</button>
      </div>
    </div>`;
  document.getElementById('stepOnStage').onclick=startFirstSetGame;
}

function startFirstSetGame(){
  stopStageCore();
  ensureCoreSchema();
  state.phase='first_set_game';
  state.firstSetScores=[];
  saveGame();

  const stageInput=buildBeginningStageInput();
  activeStageSessionId=stageInput.sessionId;

  game.innerHTML=topbar()+`
    <div class="screen" style="padding-left:6px;padding-right:6px">
      <div class="stage-core-host">
        <iframe id="stageCoreFrame" class="stage-core-frame" title="Darren's stage set"></iframe>
      </div>
    </div>`;

  const frame=document.getElementById('stageCoreFrame');
  let core=decodeStageCoreTemplate();
  const safeInput=JSON.stringify(stageInput).replace(/</g,'\\u003c');
  core=core.replace('__STAGE_INPUT_JSON__',safeInput);
  frame.srcdoc=core;
}

function updateCrowdMemoryFromStage(result){
  const crowd=state.comedy.crowds.back_room_tuesday;
  crowd.memory=crowd.memory||{};

  (result.materialResults||[]).forEach(r=>{
    if(r.riff)return;
    const premise=state.premises.find(p=>p.id===r.materialId);
    const revision=premise&&Number.isFinite(premise.revision)?premise.revision:0;
    const mem=crowd.memory[r.materialId]||{heardCount:0,lastRevision:null,lastSet:null};

    if(mem.lastRevision!==revision){
      mem.heardCount=0;
      mem.lastRevision=revision;
    }
    mem.heardCount++;
    mem.lastSet=state.comedy.totalSets+1;
    crowd.memory[r.materialId]=mem;
  });
}

function applyBeginningStageResult(result){
  ensureCoreSchema();

  state.hidden.confidence=clamp01(state.hidden.confidence+(result.confidenceDelta||0));
  state.hidden.nerves=clamp01(state.hidden.nerves+(result.nervesDelta||0));

  state.comedy.skills.stagePresence+=result.stageXP||0;
  state.comedy.skills.timeSense+=result.timeXP||0;
  state.comedy.skills.riffing+=result.riffXP||0;

  if(result.unlocks&&result.unlocks.killing)state.comedy.unlocks.killing=true;
  if(result.unlocks&&result.unlocks.crushing)state.comedy.unlocks.crushing=true;

  updateCrowdMemoryFromStage(result);

  (result.riffDiscoveries||[]).forEach(idea=>{
    if(!idea||!idea.text)return;
    if(state.comedy.pendingNotebookIdeas.some(x=>x.text===idea.text))return;
    state.comedy.pendingNotebookIdeas.push({
      id:"riff_"+Date.now()+"_"+Math.random().toString(36).slice(2),
      source:"stage_riff",
      createdDay:state.day,
      text:idea.text,
      reaction:idea.reaction||0
    });
  });

  state.comedy.totalSets++;
  state.comedy.preShow=defaultPreShowState();

  state.firstMicDone=true;
  state.firstSetResult=result;
  state.phase='first_set_result';
  saveGame();
}

window.addEventListener('message',e=>{
  const data=e.data;
  if(!data)return;

  if(data.type==="COMEDIAN_STAGE_ERROR"){
    if(!activeStageSessionId||data.sessionId!==activeStageSessionId)return;
    activeStageSessionId=null;
    stopStageCore();

    game.innerHTML=topbar()+`
      <div class="screen">
        <div class="card">
          <div class="eyebrow">STAGE CORE ERROR</div>
          <h1>The stage failed to load.</h1>
          <div class="copy">
            The game caught an integration error instead of leaving you on a dead screen.
          </div>
          <div class="end-note">${escapeHtml(data.message||"Unknown error")}</div>
          <button class="action" id="retryStage">RETRY STAGE</button>
        </div>
      </div>`;

    document.getElementById('retryStage').onclick=startFirstSetGame;
    return;
  }

  if(data.type!=="COMEDIAN_STAGE_COMPLETE")return;
  if(!activeStageSessionId||data.sessionId!==activeStageSessionId)return;

  activeStageSessionId=null;
  stopStageCore();
  applyBeginningStageResult(data.result);
  renderFirstSetResult();
});

function renderFirstSetResult(){
  const r=state.firstSetResult;
  if(!r){renderFirstSet();return;}

  const actual=r.actualSetMeter||0;
  const perceived=r.perceivedAverage||0;

  let title;
  if(r.reason==="panic")title="Your brain pulls the fire alarm.";
  else if(r.reason==="cut")title="They cut you off.";
  else if(r.bailedImmediately)title="You bailed almost immediately.";
  else if((r.over||0)>=2)title="You stayed too long.";
  else if((r.maxSilence||0)>=8)title="That silence felt like an hour.";
  else if(
    r.input&&r.input.context&&r.input.context.isFirstEver &&
    (r.over||0)<=0 &&
    (r.maxSilence||0)<6 &&
    perceived>=3.2 &&
    actual<.68
  )title="Holy shit. You think you killed.";
  else if(actual>=.90)title="That was different.";
  else if(actual>=.68)title="You got off on a high note.";
  else if(actual>=.48)title="Something worked.";
  else title="That felt long.";

  const allotted=(r.input&&r.input.role&&r.input.role.allottedSeconds)||60;
  const timing=(r.over||0)>0
    ? `${r.over.toFixed(1)} seconds over.`
    : `${Math.max(0,allotted-(r.elapsed||0)).toFixed(1)} seconds left.`;

  const crowdFeeling=perceived>=4?"hot":perceived>=2.5?"supportive":"quiet";
  let copy=`The crowd felt ${crowdFeeling}. Your set finished at ${r.displayedStatus||"ROUGH"}. ${timing}`;

  if(
    r.input&&r.input.context&&r.input.context.isFirstEver &&
    perceived>(r.earnedAverage||0)+.6
  )copy+=" They were giving the new guy some room.";

  if((r.maxSilence||0)>=6)copy+=` You left ${r.maxSilence.toFixed(1)} seconds of dead air at one point.`;
  if((r.over||0)>=2)copy+=" Everybody noticed the light.";

  const catastrophic=r.reason==="panic"||r.reason==="cut"||actual<.10;
  const wantsAgain=perceived>=2.5||actual>=.48;

  game.innerHTML=topbar()+`
    <div class="screen">
      <div class="card">
        <div class="eyebrow">FIRST SET OVER</div>
        <h1>${escapeHtml(title)}</h1>
        <div class="copy">${escapeHtml(copy)}</div>

        <div class="social-card" style="margin-top:14px">
          ${(r.materialResults||[]).map(m=>`
            <div class="person-head" style="padding:7px 0;border-bottom:1px solid #242424">
              <div class="person-name">${escapeHtml(m.name||"RIFF")}</div>
              <div class="person-role">${STAGE_REACTIONS[m.visibleReaction]||"—"}</div>
            </div>
          `).join('')}
        </div>

        <button class="action" id="returnToMic">
          ${wantsAgain?"I WANT TO DO THAT AGAIN":"GO BACK NEXT TUESDAY"}
        </button>
        <button class="boot-btn" id="backToLife">GO TO WORK TOMORROW</button>

        ${catastrophic
          ? `<button class="boot-btn" id="quitComedy">NEVER AGAIN</button>
             <div class="quit-note">There is a very real version of Darren who decides this was enough information.</div>`
          : ''}
      </div>
    </div>`;

  document.getElementById('returnToMic').onclick=commitToComedy;
  document.getElementById('backToLife').onclick=returnToRegularLife;
  const quit=document.getElementById('quitComedy');
  if(quit)quit.onclick=quitComedyForever;
}

function badWorkConsequenceChance(){
  const trouble=SOCIAL_ENGINE.workTrouble();

  // A merely mediocre day should not trigger HR roulette.
  if(trouble<.58)return {warning:0,fire:0,trouble};

  if(state.workWarnings===0){
    // First serious performance problem: mostly a warning.
    const warning=Math.min(.72,.16 + (trouble-.58)*1.05);
    return {warning,fire:0,trouble};
  }

  // Once already warned, another genuinely awful shift can cost the job.
  const fire=Math.min(.46,.06 + (trouble-.58)*.72);
  return {warning:0,fire,trouble};
}

function maybeHandleBadWorkAtClockout(){
  if(!state.employed)return false;

  const odds=badWorkConsequenceChance();
  if(odds.warning<=0 && odds.fire<=0)return false;

  const troy=state.people.find(p=>p.name==="Troy" && p.personality==="boss");
  if(!troy)return false;

  if(odds.fire>0 && Math.random()<odds.fire){
    fireForWorkPerformance(troy,odds.trouble);
    return true;
  }

  if(odds.warning>0 && Math.random()<odds.warning){
    state.workWarnings=1;
    troy.relationship=Math.max(0,troy.relationship-4);
    renderPerformanceWarning(troy,odds.trouble);
    return true;
  }

  return false;
}

  game.innerHTML=topbar()+`

            </div>

            “Your numbers were rough today. I need you to tighten that up.”
          </div>

          <div class="knowledge" style="margin-top:10px">
            Work warning.
          </div>
        </div>

        <button class="action" id="performanceWarningContinue">CLOCK OUT</button>
      </div>
    </div>`;

  document.getElementById('performanceWarningContinue').onclick=()=>endShift(true,true);
}

function fireForWorkPerformance(troy,trouble){
  state.employed=false;
  state.firedDay=state.day;

  game.innerHTML=topbar()+`
