name: COMEDIAN Visual QA

on:
  push:
    branches:
      - godot-alpha
    paths:
      - "godot/**"
      - ".github/workflows/godot-visual-qa.yml"
  workflow_dispatch:

jobs:
  capture-story-flow:
    runs-on: ubuntu-24.04

    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Wait for Pages deployment
        run: sleep 85

      - name: Capture opening and Troy interaction on mobile
        shell: bash
        run: |
          mkdir -p qa/screenshots
          cat > qa/capture.js <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 430, height: 764 } });
            const errors = [];

            page.on('pageerror', error => errors.push(`PAGE ERROR: ${error.message}`));
            page.on('console', msg => {
              if (msg.type() === 'error') errors.push(`CONSOLE ERROR: ${msg.text()}`);
            });

            const url = `https://patrickcallahancomedy.github.io/comedian/?qa=${Date.now()}`;
            await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 30000 });
            await page.waitForTimeout(9000);

            const canvasCount = await page.locator('canvas').count();
            if (canvasCount < 1) throw new Error('Godot canvas did not load');

            const shot = async (name) => {
              await page.screenshot({ path: `qa/screenshots/${name}.png`, fullPage: true });
            };
            const nextStory = async () => {
              await page.mouse.click(326, 689);
              await page.waitForTimeout(1050);
            };
            const routeLeft = async () => {
              await page.mouse.click(92, 640);
              await page.waitForTimeout(1750);
            };

            await shot('01-opening-darren');
            await nextStory();
            await shot('02-darren-works-at-boxes');
            await nextStory();
            await shot('03-not-comedian');
            await nextStory();
            await shot('04-not-trying');
            await nextStory();
            await shot('05-page5-ideas');
            await nextStory();
            await shot('06-page6-notebook');
            await nextStory();
            await shot('07-page7-troy');
            await nextStory();
            await shot('08-page8-shift-rules');

            // Page 8 now goes directly into live BOXES gameplay.
            await nextStory();
            await page.waitForTimeout(800);
            await shot('09-boxes-gameplay-start');

            // Complete the three safe tutorial boxes. Correctness is not needed
            // to reach the first thought; this run is checking timing and visuals.
            await routeLeft();
            await routeLeft();
            await routeLeft();
            await shot('10-first-safe-thought');

            // Open the first thought and save it. Finishing this save starts the
            // live conveyor and Troy's light -> silhouette -> watch sequence.
            await page.mouse.click(210, 300);
            await page.waitForTimeout(300);
            await page.mouse.click(300, 448);

            // Give the save animation time to finish, then capture two points in
            // the longer silhouette approach before Troy reaches the window.
            await page.waitForTimeout(2400);
            await shot('11-troy-approach-early');
            await page.waitForTimeout(1200);
            await shot('12-troy-approach-late');
            await page.waitForTimeout(1200);
            await shot('13-troy-watching');

            fs.writeFileSync('qa/report.json', JSON.stringify({
              url,
              canvasCount,
              title: await page.title(),
              errors
            }, null, 2));

            console.log(JSON.stringify({ canvasCount, errors }, null, 2));
            await browser.close();
            if (errors.length) process.exit(1);
          })();
          NODE
          node qa/capture.js

      - name: Upload QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comedian-visual-qa
          path: |
            qa/screenshots/*.png
            qa/report.json
          if-no-files-found: error
          retention-days: 7
