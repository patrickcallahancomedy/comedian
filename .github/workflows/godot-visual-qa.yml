name: COMEDIAN Visual QA

on:
  push:
    branches:
      - godot-alpha
    paths:
      - "godot/**"
      - ".github/workflows/godot-visual-qa.yml"
  workflow_dispatch:

jobs:
  capture-story-flow:
    runs-on: ubuntu-24.04

    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Wait for Pages deployment
        run: sleep 85

      - name: Capture story flow on mobile
        shell: bash
        run: |
          mkdir -p qa/screenshots
          cat > qa/capture.js <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 430, height: 764 } });
            const errors = [];

            page.on('pageerror', error => errors.push(`PAGE ERROR: ${error.message}`));
            page.on('console', msg => {
              if (msg.type() === 'error') errors.push(`CONSOLE ERROR: ${msg.text()}`);
            });

            const url = `https://patrickcallahancomedy.github.io/comedian/?qa=${Date.now()}`;
            await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 30000 });
            await page.waitForTimeout(9000);

            const canvasCount = await page.locator('canvas').count();
            if (canvasCount < 1) throw new Error('Godot canvas did not load');

            const shot = async (name) => {
              await page.screenshot({ path: `qa/screenshots/${name}.png`, fullPage: true });
            };
            const next = async () => {
              await page.mouse.click(326, 689);
              await page.waitForTimeout(1050);
            };

            await shot('01-opening-darren');
            await next();
            await shot('02-opening-text-right');
            await next();
            await shot('03-opening-text-left');
            await next();
            await next();
            await next();
            await shot('04-boxes-intro');
            await next();
            await next();
            await shot('05-boxes-notebook');
            await next();
            await shot('06-boxes-troy-text');

            fs.writeFileSync('qa/report.json', JSON.stringify({
              url,
              canvasCount,
              title: await page.title(),
              errors
            }, null, 2));

            console.log(JSON.stringify({ canvasCount, errors }, null, 2));
            await browser.close();
            if (errors.length) process.exit(1);
          })();
          NODE
          node qa/capture.js

      - name: Upload QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comedian-visual-qa
          path: |
            qa/screenshots/*.png
            qa/report.json
          if-no-files-found: error
          retention-days: 7
