name: COMEDIAN Skeleton Alpha Web Build

on:
  push:
    branches:
      - skeleton-alpha
    paths:
      - "godot/**"
      - ".github/workflows/godot-web-skeleton.yml"
  workflow_dispatch:

permissions:
  contents: write

# Share the deployment lock with the existing godot-alpha Pages workflow so
# two builds never try to write gh-pages at the same time.
concurrency:
  group: comedian-pages
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.7.1

jobs:
  export-web:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Godot export templates
        shell: bash
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates"
          cp -a "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" "$HOME/.local/share/godot/export_templates/"
          ls -la "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

      - name: Export Skeleton Alpha for Web
        shell: bash
        working-directory: godot
        run: |
          rm -rf build/skeleton-alpha
          mkdir -p build/skeleton-alpha
          godot --headless --path . --export-release "Web" build/skeleton-alpha/index.html
          touch build/skeleton-alpha/.nojekyll

      - name: Stamp and cache-bust Godot runtime files
        shell: bash
        working-directory: godot
        run: |
          BUILD_NAME="skeleton-${GITHUB_SHA:0:8}"
          BUILD_META="<meta name=\"comedian-skeleton-build\" content=\"${GITHUB_SHA}\">"

          mv build/skeleton-alpha/index.js "build/skeleton-alpha/${BUILD_NAME}.js"
          mv build/skeleton-alpha/index.wasm "build/skeleton-alpha/${BUILD_NAME}.wasm"
          mv build/skeleton-alpha/index.pck "build/skeleton-alpha/${BUILD_NAME}.pck"

          sed -i "s#src=\"index.js\"#src=\"${BUILD_NAME}.js\"#" build/skeleton-alpha/index.html
          sed -i "s#\"executable\":\"index\"#\"executable\":\"${BUILD_NAME}\"#" build/skeleton-alpha/index.html
          sed -i "s#\"index.pck\":#\"${BUILD_NAME}.pck\":#" build/skeleton-alpha/index.html
          sed -i "s#\"index.wasm\":#\"${BUILD_NAME}.wasm\":#" build/skeleton-alpha/index.html
          sed -i "s#</head>#${BUILD_META}</head>#" build/skeleton-alpha/index.html

          echo "COMEDIAN Skeleton Alpha build: ${GITHUB_SHA}"
          grep -o "${BUILD_NAME}[^\" ]*" build/skeleton-alpha/index.html | sort -u

      - name: Deploy Skeleton Alpha to GitHub Pages subfolder
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: godot/build/skeleton-alpha
          target-folder: skeleton-alpha
          # Do not clean the whole gh-pages branch: the existing live build at
          # the repository root must stay untouched.
          clean: false
