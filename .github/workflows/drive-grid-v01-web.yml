name: DRIVE GRID v0.1 Web

on:
  push:
    branches:
      - drive-grid-v0.1
    paths:
      - "godot/**"
      - ".github/workflows/drive-grid-v01-web.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: comedian-drive-grid-v01
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.1

jobs:
  test-and-export:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.1

    steps:
      - name: Checkout grid prototype
        uses: actions/checkout@v4

      - name: Import Godot project
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --editor --path godot --quit

      - name: Grid rules test
        shell: bash
        run: |
          set -euo pipefail
          timeout 45s godot --headless --path godot --script res://tests/drive_grid_test.gd

      - name: Prepare export templates
        shell: bash
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates"
          cp -a "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" "$HOME/.local/share/godot/export_templates/"

      - name: Export web build
        shell: bash
        working-directory: godot
        run: |
          set -euo pipefail
          rm -rf build/drive-grid-v01
          mkdir -p build/drive-grid-v01
          godot --headless --path . --export-release "Web" build/drive-grid-v01/index.html
          touch build/drive-grid-v01/.nojekyll

          # Catch the exact export bug that broke the previous phone build.
          grep -a -q "drive_grid_controller.gd" build/drive-grid-v01/index.pck
          grep -a -q "drive_grid_map.gd" build/drive-grid-v01/index.pck

          BUILD_NAME="drive-grid-v01-${GITHUB_SHA:0:8}"
          mv build/drive-grid-v01/index.js "build/drive-grid-v01/${BUILD_NAME}.js"
          mv build/drive-grid-v01/index.wasm "build/drive-grid-v01/${BUILD_NAME}.wasm"
          mv build/drive-grid-v01/index.pck "build/drive-grid-v01/${BUILD_NAME}.pck"

          sed -i "s#src=\"index.js\"#src=\"${BUILD_NAME}.js\"#" build/drive-grid-v01/index.html
          sed -i "s#\"executable\":\"index\"#\"executable\":\"${BUILD_NAME}\"#" build/drive-grid-v01/index.html
          sed -i "s#\"index.pck\":#\"${BUILD_NAME}.pck\":#" build/drive-grid-v01/index.html
          sed -i "s#\"index.wasm\":#\"${BUILD_NAME}.wasm\":#" build/drive-grid-v01/index.html

      - name: Publish grid prototype
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: godot/build/drive-grid-v01
          target-folder: drive-grid-v01
          clean: false
