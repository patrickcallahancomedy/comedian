name: COMEDIAN ALPHA

on:
  push:
    branches:
      - godot-alpha
    paths:
      - "godot/**"
      - ".github/workflows/alpha.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: comedian-alpha
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.1

jobs:
  test-export-deploy:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.1

    steps:
      - name: Checkout ALPHA
        uses: actions/checkout@v4

      - name: Remove obsolete drive experiment branches
        shell: bash
        run: |
          set -u
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          for old_branch in \
            drive-grid-v0.1 \
            drive-playtest-v0.7 \
            drive-playtest-v0.8 \
            drive-playtest-v0.9 \
            drive-playtest-v0.10 \
            drive-playtest-v0.11 \
            drive-playtest-v0.12 \
            drive-playtest-v0.13 \
            drive-playtest-v0.14
          do
            git push origin --delete "$old_branch" || true
          done

      - name: Import Godot project
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --editor --path godot --quit

      - name: Test active driving module
        shell: bash
        run: |
          set -euo pipefail
          timeout 45s godot --headless --path godot --script res://tests/drive_grid_test.gd

      - name: Prepare export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/share/godot/export_templates"
          cp -a "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" "$HOME/.local/share/godot/export_templates/"

      - name: Export ALPHA for web
        shell: bash
        working-directory: godot
        run: |
          set -euo pipefail
          rm -rf build/alpha
          mkdir -p build/alpha
          godot --headless --path . --export-release "Web" build/alpha/index.html
          touch build/alpha/.nojekyll

          grep -a -q "drive_grid_controller.gd" build/alpha/index.pck
          grep -a -q "drive_grid_map.gd" build/alpha/index.pck

          BUILD_NAME="alpha-${GITHUB_SHA:0:8}"
          mv build/alpha/index.js "build/alpha/${BUILD_NAME}.js"
          mv build/alpha/index.wasm "build/alpha/${BUILD_NAME}.wasm"
          mv build/alpha/index.pck "build/alpha/${BUILD_NAME}.pck"

          sed -i "s#src=\"index.js\"#src=\"${BUILD_NAME}.js\"#" build/alpha/index.html
          sed -i "s#\"executable\":\"index\"#\"executable\":\"${BUILD_NAME}\"#" build/alpha/index.html
          sed -i "s#\"index.pck\":#\"${BUILD_NAME}.pck\":#" build/alpha/index.html
          sed -i "s#\"index.wasm\":#\"${BUILD_NAME}.wasm\":#" build/alpha/index.html

      - name: Publish ALPHA
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: godot/build/alpha
          target-folder: alpha
          clean: false
