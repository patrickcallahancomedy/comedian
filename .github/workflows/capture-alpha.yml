name: Capture Alpha Screenshot

on:
  push:
    branches:
      - godot-alpha
    paths:
      - ".github/workflows/capture-alpha.yml"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout godot-alpha
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Capture deployed alpha
        run: |
          mkdir -p debug
          cat > /tmp/capture.mjs <<'EOF'
          import { chromium } from "playwright";

          const browser = await chromium.launch({
            headless: true,
            args: [
              "--use-gl=angle",
              "--use-angle=swiftshader",
              "--enable-webgl",
              "--ignore-gpu-blocklist",
              "--disable-gpu-sandbox"
            ]
          });
          const page = await browser.newPage({
            viewport: { width: 430, height: 932 },
            deviceScaleFactor: 1,
            isMobile: true,
            hasTouch: true
          });

          await page.goto(
            "https://patrickcallahancomedy.github.io/comedian/alpha/?build=dfc4b8e4&capture=1",
            { waitUntil: "domcontentloaded", timeout: 120000 }
          );

          await page.waitForTimeout(20000);
          await page.screenshot({
            path: "debug/alpha-screenshot.png",
            fullPage: false
          });

          await browser.close();
          EOF
          node /tmp/capture.mjs

      - name: Commit screenshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debug/alpha-screenshot.png
          git commit -m "Capture alpha screenshot"
          git push
