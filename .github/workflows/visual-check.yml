name: Visual Check

on:
  push:
    branches:
      - godot-alpha
    paths:
      - ".github/workflows/visual-check.yml"

permissions:
  contents: read

jobs:
  screenshot:
    runs-on: ubuntu-24.04
    steps:
      - name: Capture deployed alpha
        shell: bash
        run: |
          set -euo pipefail
          URL="https://patrickcallahancomedy.github.io/comedian/alpha/?build=dfc4b8e4"
          for i in {1..12}; do
            if curl -fsSL "$URL" >/dev/null; then
              break
            fi
            sleep 5
          done

          google-chrome             --headless=new             --no-sandbox             --hide-scrollbars             --window-size=430,932             --force-device-scale-factor=1             --use-gl=swiftshader             --enable-webgl             --ignore-gpu-blocklist             --virtual-time-budget=15000             --screenshot="$GITHUB_WORKSPACE/alpha-neighborhood.png"             "$URL"

          test -s "$GITHUB_WORKSPACE/alpha-neighborhood.png"

      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: alpha-neighborhood-screenshot
          path: alpha-neighborhood.png
          if-no-files-found: error
          retention-days: 2
