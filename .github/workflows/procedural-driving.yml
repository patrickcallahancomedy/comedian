name: COMEDIAN PROCEDURAL DRIVING

on:
  push:
    branches:
      - procedural-driving-prototype
    paths:
      - "godot/**"
      - ".github/workflows/procedural-driving.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: comedian-procedural-driving
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.1

jobs:
  test-export-deploy:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.1

    steps:
      - name: Checkout procedural drive
        uses: actions/checkout@v4

      - name: Import Godot project
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --editor --path godot --quit

      - name: Test grid world generator
        shell: bash
        run: |
          set -euo pipefail
          timeout 45s godot --headless --path godot --script res://tests/grid_world_generator_test.gd

      - name: Test procedural driving
        shell: bash
        run: |
          set -euo pipefail
          timeout 45s godot --headless --path godot --script res://tests/procedural_drive_test.gd

      - name: Prepare export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/share/godot/export_templates"
          cp -a "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" "$HOME/.local/share/godot/export_templates/"

      - name: Export procedural drive preview
        shell: bash
        working-directory: godot
        run: |
          set -euo pipefail

          # Preview only. The committed COMEDIAN main scene remains untouched.
          sed -i 's#run/main_scene="res://scenes/drive/drive_module.tscn"#run/main_scene="res://scenes/drive/procedural_drive_prototype.tscn"#' project.godot

          rm -rf build/procedural-drive
          mkdir -p build/procedural-drive
          godot --headless --path . --export-release "Web" build/procedural-drive/index.html
          touch build/procedural-drive/.nojekyll

          grep -a -q "grid_world_generator.gd" build/procedural-drive/index.pck
          grep -a -q "procedural_drive_controller.gd" build/procedural-drive/index.pck

          BUILD_NAME="procedural-drive-${GITHUB_SHA:0:8}"
          mv build/procedural-drive/index.js "build/procedural-drive/${BUILD_NAME}.js"
          mv build/procedural-drive/index.wasm "build/procedural-drive/${BUILD_NAME}.wasm"
          mv build/procedural-drive/index.pck "build/procedural-drive/${BUILD_NAME}.pck"

          sed -i "s#src=\"index.js\"#src=\"${BUILD_NAME}.js\"#" build/procedural-drive/index.html
          sed -i "s#\"executable\":\"index\"#\"executable\":\"${BUILD_NAME}\"#" build/procedural-drive/index.html
          sed -i "s#\"index.pck\":#\"${BUILD_NAME}.pck\":#" build/procedural-drive/index.html
          sed -i "s#\"index.wasm\":#\"${BUILD_NAME}.wasm\":#" build/procedural-drive/index.html

      - name: Publish procedural drive preview
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: godot/build/procedural-drive
          target-folder: procedural-drive
          clean: true
          force: false
