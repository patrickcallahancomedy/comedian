name: COMEDIAN Godot Fuzz

on:
  push:
    branches:
      - godot-alpha
      - skeleton-alpha
    paths:
      - "godot/**"
      - ".github/workflows/godot-fuzz.yml"
  pull_request:
    paths:
      - "godot/**"
      - ".github/workflows/godot-fuzz.yml"
  workflow_dispatch:
    inputs:
      runs:
        description: Number of randomized playthroughs
        required: false
        default: "1000"
      seed:
        description: Optional starting seed; blank derives it from the commit
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: comedian-godot-fuzz-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.1

jobs:
  fuzz-boxes:
    name: Fuzz BOXES + Skeleton state
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: barichello/godot-ci:4.7.1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Import Godot resources and register script classes
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --editor --path godot --quit

      - name: Run Skeleton Alpha structural and state suite
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path godot \
            --script res://tests/skeleton_state_test.gd \
            2>&1 | tee skeleton-state-test.log

      - name: Select deterministic seed range
        id: fuzz-config
        shell: bash
        env:
          REQUESTED_RUNS: ${{ inputs.runs }}
          REQUESTED_SEED: ${{ inputs.seed }}
        run: |
          set -euo pipefail

          runs="${REQUESTED_RUNS:-1000}"
          if [[ -n "${REQUESTED_SEED:-}" ]]; then
            base_seed="$REQUESTED_SEED"
          else
            base_seed=$((16#${GITHUB_SHA:0:7}))
          fi

          echo "runs=$runs" >> "$GITHUB_OUTPUT"
          echo "seed=$base_seed" >> "$GITHUB_OUTPUT"
          echo "Fuzzing $runs playthroughs beginning with seed $base_seed"

      - name: Run deterministic BOXES fuzz suite
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path godot --fixed-fps 120 \
            --script res://tests/boxes_fuzz.gd -- \
            --runs=${{ steps.fuzz-config.outputs.runs }} \
            --seed=${{ steps.fuzz-config.outputs.seed }} \
            2>&1 | tee boxes-fuzz.log

      - name: Run virtual first-time player
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path godot --fixed-fps 120 \
            --script res://tests/boxes_virtual_player.gd -- \
            --seed=${{ steps.fuzz-config.outputs.seed }} \
            2>&1 | tee virtual-player-report.txt

          sed -n '/VIRTUAL PLAYER REPORT BEGIN/,/VIRTUAL PLAYER REPORT END/p' \
            virtual-player-report.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload virtual player report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boxes-virtual-player-${{ github.run_id }}
          path: virtual-player-report.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: godot-test-failure-${{ github.run_id }}
          path: |
            skeleton-state-test.log
            boxes-fuzz.log
          if-no-files-found: warn
          retention-days: 14
