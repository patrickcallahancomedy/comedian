name: COMEDIAN GRID WORLD GENERATOR

on:
  push:
    branches:
      - grid-world-generator
    paths:
      - "godot/**"
      - ".github/workflows/grid-world-generator.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: comedian-grid-world-generator
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.1

jobs:
  test-export-deploy:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.1

    steps:
      - name: Checkout grid world prototype
        uses: actions/checkout@v4

      - name: Import Godot project
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --editor --path godot --quit

      - name: Test grid world generator
        shell: bash
        run: |
          set -euo pipefail
          timeout 45s godot --headless --path godot --script res://tests/grid_world_generator_test.gd

      - name: Prepare export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/share/godot/export_templates"
          cp -a "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" "$HOME/.local/share/godot/export_templates/"

      - name: Export grid world preview
        shell: bash
        working-directory: godot
        run: |
          set -euo pipefail

          # Preview only. The committed COMEDIAN main scene remains untouched.
          sed -i 's#run/main_scene="res://scenes/drive/drive_module.tscn"#run/main_scene="res://scenes/drive/grid_world_prototype.tscn"#' project.godot

          rm -rf build/gridworld
          mkdir -p build/gridworld
          godot --headless --path . --export-release "Web" build/gridworld/index.html
          touch build/gridworld/.nojekyll

          grep -a -q "grid_world_generator.gd" build/gridworld/index.pck
          grep -a -q "grid_world_map.gd" build/gridworld/index.pck

          BUILD_NAME="gridworld-${GITHUB_SHA:0:8}"
          mv build/gridworld/index.js "build/gridworld/${BUILD_NAME}.js"
          mv build/gridworld/index.wasm "build/gridworld/${BUILD_NAME}.wasm"
          mv build/gridworld/index.pck "build/gridworld/${BUILD_NAME}.pck"

          sed -i "s#src=\"index.js\"#src=\"${BUILD_NAME}.js\"#" build/gridworld/index.html
          sed -i "s#\"executable\":\"index\"#\"executable\":\"${BUILD_NAME}\"#" build/gridworld/index.html
          sed -i "s#\"index.pck\":#\"${BUILD_NAME}.pck\":#" build/gridworld/index.html
          sed -i "s#\"index.wasm\":#\"${BUILD_NAME}.wasm\":#" build/gridworld/index.html

          # Also publish this exact build at a unique path. Mobile browsers can
          # aggressively reuse the fixed /gridworld/ page even with a query
          # string, while a new pathname guarantees a fresh Godot shell.
          VERSION_DIR="build/gridworld/v-${GITHUB_SHA:0:8}"
          mkdir -p "${VERSION_DIR}"
          find build/gridworld -maxdepth 1 -type f -exec cp -a {} "${VERSION_DIR}/" \\;

      - name: Publish grid world preview
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: godot/build/gridworld
          target-folder: gridworld
          clean: true
          force: false
