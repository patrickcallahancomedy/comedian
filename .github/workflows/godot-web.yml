name: COMEDIAN Godot Web Build

on:
  push:
    branches:
      - godot-alpha
    paths:
      - "godot/**"
      - ".github/workflows/godot-web.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.7.1

jobs:
  export-web:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Godot export templates
        shell: bash
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates"
          cp -a "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" "$HOME/.local/share/godot/export_templates/"
          ls -la "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

      - name: Export COMEDIAN for Web
        shell: bash
        working-directory: godot
        run: |
          rm -rf build/web
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
          touch build/web/.nojekyll

      - name: Cache-bust Godot runtime files
        shell: bash
        working-directory: godot
        run: |
          BUILD_NAME="game-${GITHUB_SHA:0:8}"

          mv build/web/index.js "build/web/${BUILD_NAME}.js"
          mv build/web/index.wasm "build/web/${BUILD_NAME}.wasm"
          mv build/web/index.pck "build/web/${BUILD_NAME}.pck"

          sed -i "s#src=\"index.js\"#src=\"${BUILD_NAME}.js\"#" build/web/index.html
          sed -i "s#\"executable\":\"index\"#\"executable\":\"${BUILD_NAME}\"#" build/web/index.html
          sed -i "s#\"index.pck\":#\"${BUILD_NAME}.pck\":#" build/web/index.html
          sed -i "s#\"index.wasm\":#\"${BUILD_NAME}.wasm\":#" build/web/index.html

          grep -o "${BUILD_NAME}[^\" ]*" build/web/index.html | sort -u

      - name: Deploy playable build to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: godot/build/web
          clean: true
          single-commit: true
