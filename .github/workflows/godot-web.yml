name: COMEDIAN Godot Web Build

on:
  push:
    branches:
      - godot-alpha
    paths:
      - "godot/**"
      - ".github/workflows/godot-web.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.7.1

jobs:
  export-web:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Materialize embedded thought bubble asset
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import pathlib
          import re

          source = pathlib.Path("godot/scripts/boxes/thought_bubble_asset.gd").read_text()
          match = re.search(r'PNG_BASE64 := "([^"]+)"', source)
          if not match:
              raise SystemExit("Thought bubble PNG data not found")

          output = pathlib.Path("godot/assets/boxes/thought_bubble.png")
          output.write_bytes(base64.b64decode(match.group(1)))
          print(f"Wrote {output} ({output.stat().st_size} bytes)")
          PY

      - name: Prepare Godot export templates
        shell: bash
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates"
          cp -a "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" "$HOME/.local/share/godot/export_templates/"
          ls -la "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

      - name: Export COMEDIAN for Web
        shell: bash
        working-directory: godot
        run: |
          rm -rf build/web
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
          touch build/web/.nojekyll

      - name: Deploy playable build to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: godot/build/web
          clean: true
          single-commit: true
