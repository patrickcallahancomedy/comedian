name: Capture Alpha Screenshot V2

on:
  workflow_dispatch:
  push:
    branches:
      - godot-alpha
    paths:
      - "godot/**"
      - ".github/workflows/capture-alpha-v2.yml"

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve latest game build
        shell: bash
        run: |
          set -euo pipefail
          TARGET_SHA="$(git log -1 --format=%H -- godot)"
          echo "TARGET_SHORT=${TARGET_SHA:0:8}" >> "$GITHUB_ENV"

      - name: Wait for exact build on Pages
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl -fsSL "https://patrickcallahancomedy.github.io/comedian/alpha/?build=${TARGET_SHORT}&wait=${attempt}" | grep -q "alpha-${TARGET_SHORT}"; then
              echo "Deployed build ${TARGET_SHORT} is live."
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for deployed build ${TARGET_SHORT}."
          exit 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright and Chromium
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Capture deployed turn guidance
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p debug
          cat > capture-alpha.mjs <<'EOF'
          import { chromium } from "playwright";

          const browser = await chromium.launch({
            headless: false,
            args: [
              "--use-gl=angle",
              "--use-angle=swiftshader",
              "--enable-unsafe-swiftshader",
              "--enable-webgl",
              "--ignore-gpu-blocklist",
              "--disable-gpu-sandbox"
            ]
          });

          const context = await browser.newContext({
            viewport: { width: 430, height: 932 },
            deviceScaleFactor: 1,
            isMobile: true,
            hasTouch: true
          });

          const page = await context.newPage();
          const build = process.env.TARGET_SHORT;

          await page.goto(
            `https://patrickcallahancomedy.github.io/comedian/alpha/?build=${build}&capture=turns`,
            { waitUntil: "domcontentloaded", timeout: 120000 }
          );

          await page.waitForTimeout(15000);

          // START is rendered inside the Godot canvas, so tap its known mobile
          // control position rather than looking for a DOM text node.
          await page.touchscreen.tap(215, 884);

          // First planned turn approaching (1, 1).
          await page.waitForTimeout(1400);
          await page.screenshot({
            path: "debug/alpha-first-turn.png",
            fullPage: false
          });

          // Continue straight past the planned turn. The route should recalculate
          // and move the arrow to the next best intersection.
          await page.waitForTimeout(1000);
          await page.screenshot({
            path: "debug/alpha-reroute.png",
            fullPage: false
          });

          // Reload and take the correct route so QA also reaches the highway.
          await page.reload({ waitUntil: "domcontentloaded", timeout: 120000 });
          await page.waitForTimeout(12000);
          await page.touchscreen.tap(215, 884);

          // Turn right for the planned neighborhood route, then verify the
          // completed marker clears before continuing toward the highway.
          await page.waitForTimeout(1600);
          await page.touchscreen.tap(335, 835);
          await page.waitForTimeout(900);
          await page.screenshot({
            path: "debug/alpha-correct-turn.png",
            fullPage: false
          });

          // Catch the on-ramp mid-transition, then the highway after the merge.
          await page.waitForTimeout(2100);
          await page.screenshot({
            path: "debug/alpha-connector-one.png",
            fullPage: false
          });

          await page.waitForTimeout(2400);
          await page.screenshot({
            path: "debug/alpha-highway.png",
            fullPage: false
          });

          // Third pass: take the correct neighborhood route, move into the
          // rightmost highway lane, and capture the off-ramp toward the city.
          await page.reload({ waitUntil: "domcontentloaded", timeout: 120000 });
          await page.waitForTimeout(12000);
          await page.touchscreen.tap(215, 884);
          await page.waitForTimeout(1600);
          await page.touchscreen.tap(335, 835);

          // Wait until the car is firmly on the highway, then move right once.
          await page.waitForTimeout(4700);
          await page.touchscreen.tap(335, 835);

          // Capture around the highway-to-city connector transition.
          await page.waitForTimeout(3400);
          await page.screenshot({
            path: "debug/alpha-connector-two.png",
            fullPage: false
          });

          // Let the car reach the far city edge. It will pause there until the
          // final turn, which makes this timing resilient across minor speed changes.
          await page.waitForTimeout(8000);
          await page.screenshot({
            path: "debug/alpha-city.png",
            fullPage: false
          });

          // Turn left toward the curbside destination and capture the venue arrival.
          await page.touchscreen.tap(95, 835);
          await page.waitForTimeout(2300);
          await page.screenshot({
            path: "debug/alpha-venue-arrival.png",
            fullPage: false
          });

          await browser.close();
          EOF

          xvfb-run -a node capture-alpha.mjs

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: alpha-neighborhood-screenshot-v2
          path: |
            debug/alpha-first-turn.png
            debug/alpha-reroute.png
            debug/alpha-correct-turn.png
            debug/alpha-connector-one.png
            debug/alpha-highway.png
            debug/alpha-connector-two.png
            debug/alpha-city.png
            debug/alpha-venue-arrival.png
          if-no-files-found: error
          retention-days: 7
