name: Capture ALPHA Screenshot

on:
  push:
    branches:
      - godot-alpha
    paths:
      - "godot/**"
      - ".github/workflows/alpha-screenshot.yml"

permissions:
  contents: write

concurrency:
  group: comedian-alpha-screenshot
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout godot-alpha
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve latest game commit
        id: target
        shell: bash
        run: |
          set -euo pipefail
          TARGET_SHA="$(git log -1 --format=%H -- godot)"
          echo "sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "short=${TARGET_SHA:0:8}" >> "$GITHUB_OUTPUT"

      - name: Give Pages a moment to settle
        shell: bash
        run: sleep 8

      - name: Install Playwright
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Capture mobile screenshot
        shell: bash
        env:
          TARGET_SHORT: ${{ steps.target.outputs.short }}
        run: |
          mkdir -p qa
          cat > capture-alpha.js <<'NODE'
          const { chromium } = require("playwright");

          (async () => {
            const short = process.env.TARGET_SHORT;
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({
              viewport: { width: 430, height: 932 },
              deviceScaleFactor: 2,
              isMobile: true,
              hasTouch: true,
            });

            await page.goto(
              `https://patrickcallahancomedy.github.io/comedian/alpha/?build=${short}&qa=1`,
              { waitUntil: "domcontentloaded", timeout: 120000 }
            );

            await page.waitForTimeout(15000);
            await page.screenshot({
              path: "qa/latest-alpha.png",
              fullPage: true,
            });

            await browser.close();
          })();
          NODE

          node capture-alpha.js

      - name: Upload screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: alpha-qa-screenshot
          path: qa/latest-alpha.png
          if-no-files-found: error
          retention-days: 2

      - name: Commit latest screenshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "COMEDIAN QA"
          git config user.email "actions@users.noreply.github.com"

          git add qa/latest-alpha.png
          if git diff --cached --quiet; then
            echo "Screenshot unchanged."
            exit 0
          fi

          git commit -m "Update ALPHA QA screenshot [skip ci]"
          git pull --rebase origin godot-alpha
          git push origin HEAD:godot-alpha
